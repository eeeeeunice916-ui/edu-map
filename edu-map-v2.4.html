<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육환경 위치도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --sub:#5b6470; --line:#e3e6ea; --soft:#f6f7f9; --blue:#2f6fdf; --blueSoft:#eef3fc; --blueInk:#2459c4;
  --proj:#e5484d; --gate:#f08c00; --ok:#1a7f37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif);font-size:15px}
button,input,select,textarea{font-family:inherit}
/* 틀 */
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:relative}
#topbar .brand{font-weight:700;font-size:16px;white-space:nowrap}
#topbar .pname{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#saved{font-size:12px;color:var(--ok);background:#eaf6ec;padding:2px 8px;border-radius:10px;white-space:nowrap}
#main{flex:1;display:flex;min-height:0}
#rail{width:88px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:12px 8px;background:#fbfcfd}
.rstep{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;border:none;background:transparent;color:#4a5260;cursor:pointer}
.rstep .dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#e9ecef;color:#4a5260}
.rstep .nm{font-size:12px;font-weight:500}
.rstep.cur{background:var(--blueSoft);color:var(--blueInk)}
.rstep.cur .dot{background:var(--blue);color:#fff}
.rstep.done .dot{background:#d7ecdc;color:var(--ok)}
#mapWrap{flex:1;position:relative;min-width:0;background:#eef0f3}
#frame{position:absolute;inset:0}
#frame.print{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(0,0,0,.14);background:#fff}
#map{position:absolute;inset:0;background:#f2f3f5}
.leaflet-container{font-family:inherit}
#panel{width:430px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1000px){
  #main{flex-direction:column}
  #rail{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);padding:6px;overflow-x:auto}
  .rstep{flex:1;min-width:64px;padding:6px 4px}
  #mapWrap{flex:none;height:55vh}
  #panel{width:auto;border-left:none;border-top:1px solid var(--line);flex:1}
}
/* 공통 컨트롤 */
.btn{height:40px;padding:0 14px;border-radius:9px;border:1px solid #d6dae0;background:#fff;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f7f9}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:#2a62c8}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{height:34px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.on{background:var(--blueSoft);border-color:var(--blue);color:var(--blueInk)}
.btn.full{width:100%}
.btn.dashed{border-style:dashed;border-color:#b9c3d3;background:#f7f9fc;color:var(--blueInk)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid #d6dae0;border-radius:9px;overflow:hidden}
.seg button{height:36px;border:none;border-left:1px solid #d6dae0;background:#fff;font-size:13px;color:var(--ink);cursor:pointer;padding:0 4px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--blue);color:#fff}
.inp{height:38px;border:1px solid #d6dae0;border-radius:8px;padding:0 10px;font-size:14px;width:100%;background:#fff}
.inp.sm{height:32px;font-size:13.5px;padding:0 8px}
select.inp{padding:0 6px}
.lab{font-size:13px;color:#4a5260;margin-bottom:4px;display:block}
.muted{color:var(--sub);font-size:13px;line-height:1.55}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.card.hl{border-color:#c9d8f5;background:#fbfcff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parcel{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.parcel:last-child{border-bottom:none}
.parcel .t{flex:1;line-height:1.45;min-width:0}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:#4a5260;white-space:nowrap}
.badge.abs{background:#fff1e0;color:#9a5b00}
.badge.rel{background:var(--blueSoft);color:var(--blueInk)}
.badge.out{background:#eaf6ec;color:var(--ok)}
.badge.bad{background:#fdecec;color:#c42b2b}
.stepHead .no{font-size:12.5px;color:var(--sub)}
.stepHead h2{margin:2px 0 0;font-size:20px}
.sumbox{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:76px minmax(0,1fr);row-gap:6px;font-size:14px}
.sumbox .k{color:var(--sub)}
.next{margin-top:auto}
.prog{height:6px;background:#e9ecef;border-radius:3px}
.prog i{display:block;height:6px;background:var(--blue);border-radius:3px}
.item{border:1px solid var(--line);border-radius:12px;background:#fff}
.item.open{border-color:#c9d8f5;background:#fbfcff}
.ihead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:none;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.ihead .sd{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sd.ok{background:#d7ecdc;color:var(--ok)}
.sd.todo{background:#fff1e0;color:#9a5b00}
.ihead .tt{flex:1;min-width:0}
.ihead .tt b{font-size:14px;font-weight:600;display:block}
.ihead .tt span{font-size:12px;color:var(--sub)}
.ihead .vv{font-size:12.5px;text-align:right;white-space:pre-line;color:var(--ink)}
.ibody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.res{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px;line-height:1.5}
.res .s{font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 12px;border-radius:8px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:600}
td.l{text-align:left}
td[contenteditable]{background:#fffdf3;outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.sent{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.roadg{display:grid;grid-template-columns:34px minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:12.5px}
.roadg .h{color:var(--sub);text-align:center}
/* 지도 위 */
.top{position:absolute;left:12px;right:12px;top:12px;z-index:1000}
.searchRow{display:flex;gap:6px}
.searchRow input{flex:1;min-width:0;height:42px;border:1px solid #d6dae0;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:520px}
.results div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.results div:hover{background:var(--soft)}
.results small{color:var(--sub)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#frame.print ~ .top, #mapWrap.printing .top{display:none}
#modeBar{position:absolute;left:12px;bottom:14px;z-index:1000;display:none;align-items:center;gap:8px;max-width:calc(100% - 24px);
  background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#modeBar span{font-size:14px;line-height:1.35}
#modeBar button{background:#fff;color:var(--ink);border:none;border-radius:8px;height:32px;padding:0 12px;font-size:13.5px;cursor:pointer}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:3000;display:none;max-width:90vw}
#zoneHint{position:absolute;left:12px;bottom:40px;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub);display:none}
#mapMsg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:1200;display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;line-height:1.6;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#legend,#pLegend{position:absolute;right:12px;bottom:46px;z-index:900;background:rgba(255,255,255,.96);border:1px solid #c9ced6;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.85;display:none}
#pLegend{border-radius:0;bottom:12px}
#legend i,#pLegend i{display:inline-block;width:18px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px}
#pTitle{position:absolute;left:12px;top:12px;z-index:900;background:#fff;border:1px solid #c9ced6;padding:6px 12px;font-size:14px;font-weight:700;display:none}
#pNorth{position:absolute;right:14px;top:12px;z-index:900;display:none}
#layerPanel{position:absolute;right:12px;top:104px;z-index:1001;width:300px;max-width:calc(100% - 24px);max-height:calc(100% - 170px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
#layerPanel h4{margin:12px 0 4px;font-size:12px;color:var(--sub)}
#layerPanel label{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.lgsw{width:12px;height:12px;border-radius:2px;flex:none}
.nearLbl{transform:translate(-50%,-50%);font-size:calc(var(--lblfs,12px) - 2px);color:#222;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff}
.zlo .nearLbl{display:none}
.lbl{transform:translate(-50%,-50%);color:#fff;font-size:var(--lblfs,12px);padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:600;display:inline-block}
.iw{padding:4px 2px;font-size:13px;line-height:1.5}
/* 팝업 상자 */
#pop{position:absolute;right:18px;top:52px;z-index:2000;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:14px;display:none;flex-direction:column;gap:10px}
#dlgBack{position:fixed;inset:0;background:rgba(20,24,30,.35);z-index:2500;display:none;align-items:center;justify-content:center;padding:16px}
#dlg{width:560px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.plist{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.plist.cur{border-color:var(--blue);background:#fbfcff}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">교육환경 위치도</div>
    <div style="color:#c3c8cf">/</div>
    <div class="pname" id="tbName"></div>
    <div id="saved">자동 저장됨</div>
    <div style="flex:1"></div>
    <button class="btn sm" id="btnProjects">사업 목록</button>
    <button class="btn sm" id="setBtn">글씨체·크기</button>
    <div id="pop">
      <div><label class="lab" for="fontSel">글씨체</label><select class="inp" id="fontSel"></select></div>
      <div><label class="lab" for="sizeSel">패널 글씨 크기</label>
        <select class="inp" id="sizeSel"><option value="13">작게</option><option value="15">보통</option><option value="17">크게</option><option value="19">아주 크게</option></select></div>
      <div><label class="lab" for="lblSel">지도 위 글씨 크기</label>
        <select class="inp" id="lblSel"><option value="10">작게</option><option value="12">보통</option><option value="14">크게</option><option value="17">아주 크게</option></select></div>
      <div class="muted">바탕지도의 지명·도로명은 브이월드 그림이라 바뀌지 않아요. 학교명·시설명·지번·거리 표시는 바뀌어요.</div>
    </div>
  </header>
  <div id="main">
    <nav id="rail" aria-label="작업 단계"></nav>
    <div id="mapWrap">
      <div id="frame">
        <div id="map"></div>
        <div id="pTitle"></div>
        <div id="pLegend"></div>
        <div id="pNorth" aria-hidden="true"><svg width="26" height="44" viewBox="0 0 26 44"><path d="M13 2 L22 30 L13 24 L4 30 Z" fill="#1f2328"/><text x="13" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">N</text></svg></div>
      </div>
      <div id="mapMsg"></div>
      <div class="top">
        <div class="searchRow">
          <input id="q" placeholder="주소·지번·학교·시설 이름 검색" enterkeyhint="search" aria-label="검색">
          <button class="btn dark" id="qBtn">검색</button>
        </div>
        <div class="results" id="results" style="display:none"></div>
        <div class="chips">
          <button class="chip" id="chipLayer">레이어</button>
          <button class="chip" id="chip300">300m 범위</button>
          <button class="chip" id="chipLeg">범례</button>
          <button class="chip" id="chipFit">전체 보기</button>
        </div>
      </div>
      <div id="legend"></div>
      <div id="layerPanel"></div>
      <div id="zoneHint"></div>
      <div id="modeBar"><span id="modeText"></span><button id="modeUndo" style="display:none">되돌리기</button><button id="modeDone">완료</button></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<div id="dlgBack"><div id="dlg" role="dialog" aria-modal="true" aria-label="사업 목록"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<div id="toast"></div>

<script>
/* ===== 설정 ===== */
const APP_VERSION = "3.0";
const VW_KEY = "1C3C3956-A882-416D-8DE7-3A232A4B096B";
const DOMAIN = location.origin;            // 브이월드에 등록한 서비스URL과 같아야 함
const KINDS = ["유치원","초등학교","중학교","고등학교","특수학교","기타"];
const WALK_SPEED = 0.7;                    // m/s (평가서 기준)
const FAC_TYPES = {
  park:  { name:"공원·녹지",            color:"#2e9e4f" },
  cult:  { name:"도서관·문화·체육시설",  color:"#8e44ad" },
  gateA: { name:"단지 출입구",          color:"#c2255c" },
  cons:  { name:"공사차량 출입구",       color:"#8d5a2b" },
  haz:   { name:"위험·유해시설",         color:"#212529" },
  etc:   { name:"기타",                 color:"#495057" }
};
const GRADE = ["", "매우미흡", "미흡", "보통", "우수", "매우우수"];
const STEPS = ["사업지", "대상학교", "위치항목", "위치도", "결과"];
const ROAD_FN = ["", "주간선", "보조간선", "집산", "국지"];
const DIR4 = [["E","동측"],["W","서측"],["S","남측"],["N","북측"]];

/* ===== 공통 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const m1 = n => (Math.round(n*10)/10).toLocaleString("ko-KR", { minimumFractionDigits:1, maximumFractionDigits:1 });
const uid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e4);
let toastT;
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none", ms); }
function josa(word, a, b){ const c = String(word).trim().slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return a+"("+b+")"; return (c-0xAC00)%28 ? b : a; }
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function uniq(a){ return [...new Set(a.filter(Boolean))]; }

/* ===== 사업(프로젝트) 저장 ===== */
const PKEY = "eduMap.projects";
function blankState(name){
  return { name: name || "새 사업", project:[], schools:[], facs:[], routes:[], walks:[],
    manual:{ traffic:{}, roads:{}, link:{} }, after:{},
    print:{ preset:"loc", paper:"land", title:"<사업지 및 대상학교 위치도>", disp:null } };
}
function normalize(s){
  const b = blankState();
  s = { ...b, ...(s || {}) };
  ["project","schools","facs","routes","walks"].forEach(k => s[k] = s[k] || []);
  s.manual = { ...b.manual, ...(s.manual || {}) };
  ["traffic","roads","link"].forEach(k => s.manual[k] = s.manual[k] || {});
  s.after = s.after || {};
  s.print = { ...b.print, ...(s.print || {}) };
  s.schools.forEach(sc => {
    if (sc.short === undefined) sc.short = "";
    if (!sc.zsrc) sc.zsrc = sc.planned ? "planned" : "calc";
    if (sc.zsrc === "official" && !sc.official) sc.zsrc = "calc";
    delete sc.planned;
  });
  return s;
}
let reg = ls(PKEY) || { list:[], cur:null };
let state;
(function boot(){
  if (!reg.list.length){
    const old = ls("eduMap.v1");               // 예전 버전 자료 옮기기
    const id = uid("p");
    const st = normalize(old && old.project ? { ...old, name: old.name || "첫 사업" } : blankState("첫 사업"));
    reg = { list:[{ id, name: st.name, updated: Date.now() }], cur:id };
    ls("eduMap.p." + id, st); ls(PKEY, reg);
  }
  if (!reg.list.find(p => p.id === reg.cur)) reg.cur = reg.list[0].id;
  state = normalize(ls("eduMap.p." + reg.cur));
})();
let saveT;
function save(){
  ls("eduMap.p." + reg.cur, state);
  const it = reg.list.find(p => p.id === reg.cur);
  if (it){ it.name = state.name; it.updated = Date.now(); }
  ls(PKEY, reg);
  const sv = $("#saved"); sv.textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
  clearTimeout(saveT); saveT = setTimeout(() => sv.textContent = "자동 저장됨", 2500);
}
const showOf = s => (s.show = s.show || { site:true, abs:true, rel:true });

/* ===== 브이월드 (JSONP) ===== */
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cb = "vwcb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };

async function vwData(layer, extra){

    service:"data", version:"2.0", request:"GetFeature", data:layer, key:VW_KEY, domain:DOMAIN,
    format:"json", errorformat:"json", size:10, page:1, geometry:"true", attribute:"true", crs:"EPSG:4326", ...extra
  });

  if (r.status === "NOT_FOUND") return [];

}

/* ===== 기하 계산 (미터) ===== */
function polysOf(g){ return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; }
function ringsOf(g){ return polysOf(g).flat(); }
function makeXY(ref){ const k = Math.cos(ref[1]*Math.PI/180)*111320; return c => [(c[0]-ref[0])*k, (c[1]-ref[1])*110574]; }
function segT(p, a, b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; return Math.max(0, Math.min(1, t)); }
function segDist(p, a, b){ const t = segT(p,a,b); return Math.hypot(p[0]-a[0]-t*(b[0]-a[0]), p[1]-a[1]-t*(b[1]-a[1])); }
// 가장 가까운 두 점 (치수선용)
function nearestPairG(A, B){
  const xy = makeXY(ringsOf(A)[0][0]);
  let best = { d:Infinity };
  const run = (P, Q, flip) => {
    for (const ra of ringsOf(P)) for (const v of ra){
      const p = xy(v);
      for (const rb of ringsOf(Q)) for (let i=0;i<rb.length-1;i++){
        const a = xy(rb[i]), b = xy(rb[i+1]), t = segT(p,a,b);
        const d = Math.hypot(p[0]-a[0]-t*(b[0]-a[0]), p[1]-a[1]-t*(b[1]-a[1]));
        if (d < best.d){ const q = [rb[i][0] + t*(rb[i+1][0]-rb[i][0]), rb[i][1] + t*(rb[i+1][1]-rb[i][1])]; best = flip ? { d, a:q, b:v } : { d, a:v, b:q }; }
      }
    }
  };
  run(A, B, false); run(B, A, true);
  return best;
}
function intersects(A, B){ try { return turf.booleanIntersects(turf.feature(A), turf.feature(B)); } catch(e){ return false; } }
function geomDist(A, B){ return intersects(A, B) ? 0 : nearestPairG(A, B).d; }
function setDist(As, Bs){ let m = Infinity; As.forEach(a => Bs.forEach(b => m = Math.min(m, geomDist(a,b)))); return m; }
function pointDist(pt, Gs){
  let m = Infinity;
  const xy = makeXY(pt), p = xy(pt);
  for (const g of Gs){
    try { if (turf.booleanPointInPolygon(turf.point(pt), turf.feature(g))) return 0; } catch(e){}
    for (const r of ringsOf(g)) for (let i=0;i<r.length-1;i++) m = Math.min(m, segDist(p, xy(r[i]), xy(r[i+1])));
  }
  return m;
}
function ptpt(a, b){ return turf.distance(turf.point(a), turf.point(b), { units:"meters" }); }
function shapeDist(A, B){
  if (A.polys.length && B.polys.length) return setDist(A.polys, B.polys);
  if (A.polys.length && B.pt) return pointDist(B.pt, A.polys);
  if (B.polys.length && A.pt) return pointDist(A.pt, B.polys);
  if (A.pt && B.pt) return ptpt(A.pt, B.pt);
  return null;
}
const schoolShape = s => ({ polys: s.parcels.map(p => p.geom), pt: s.parcels.length ? null : s.gate });
const facShape = f => ({ polys: f.parcels.map(p => p.geom), pt: f.parcels.length ? null : f.point });
const projShape = () => ({ polys: state.project.map(p => p.geom), pt: null });
const hasShape = sh => sh.polys.length || sh.pt;
function centroidOf(Gs){ return turf.centroid(turf.featureCollection(Gs.map(g => turf.feature(g)))).geometry.coordinates; }
function shapeCenter(sh){ return sh.polys.length ? centroidOf(sh.polys) : sh.pt; }
const DIRS = ["북","북동","동","남동","남","남서","서","북서"];
function dirName(from, to){ let b = turf.bearing(turf.point(from), turf.point(to)); b = (b+360)%360; return DIRS[Math.round(b/45)%8]; }
function areaOf(Gs){ return Gs.reduce((s,g) => s + turf.area(turf.feature(g)), 0); }
function routeLen(r){ let L = 0; for (let i=1;i<r.pts.length;i++) L += ptpt(r.pts[i-1], r.pts[i]); return L; }
function bufferOf(gs, m){
  try {
    const bs = gs.map(g => turf.buffer(turf.feature(g), m, { units:"meters" }));
    return bs.length > 1 ? turf.union(turf.featureCollection(bs)) : bs[0];
  } catch(e){ return null; }
}

const useOfficial = s => s.zsrc === "official" && s.official;
// 기존 학교: 출입문에서 50m / 신설(학교설립예정지): 학교경계에서 50m
function absZone(s){

}
// 상대보호구역: 학교경계로부터 200m 중 절대보호구역 제외

  return buf;
}
async function loadOfficial(s){

  if (kind === "중학교" || kind === "고등학교") return d <= 800 ? 5 : d <= 1600 ? 4 : d <= 2400 ? 3 : d <= 3000 ? 2 : 1;

const findS = id => state.schools.find(x => x.id === id);
const findF = id => state.facs.find(x => x.id === id);

function nearestFac(s, type){
  const sh = schoolShape(s); if (!hasShape(sh)) return null;
  let best = null;
  state.facs.filter(f => f.type === type).forEach(f => {
    const fs = facShape(f); if (!hasShape(fs)) return;
    const d = shapeDist(sh, fs);
    if (d !== null && (!best || d < best.d)) best = { f, d };
  });
  return best;
}
function entranceDist(s){
  const target = s.gate ? { polys:[], pt:s.gate } : schoolShape(s);
  if (!hasShape(target)) return null;
  let best = null;
  state.facs.filter(f => f.type === "gateA").forEach(f => {
    const fs = facShape(f); if (!hasShape(fs)) return;
    const d = shapeDist(target, fs);
    if (d !== null && (!best || d < best.d)) best = { f, d, toGate: !!s.gate };
  });
  return best;
}
function hazards(s){

  return state.facs.filter(f => f.type === "haz").map(f => { const fs = facShape(f); return hasShape(fs) ? { f, d: shapeDist(sh, fs) } : null; }).filter(x => x && x.d <= 300);

function schoolRow(s, i){
  const sh = schoolShape(s), pj = projShape(), out = { s, i };
  if (pj.polys.length && hasShape(sh)){
    out.dB = s.parcels.length ? setDist(pj.polys, sh.polys) : null;
    out.dG = s.gate ? pointDist(s.gate, pj.polys) : null;
    out.dAny = out.dB !== null ? out.dB : out.dG;
    out.dir = dirName(shapeCenter(sh), centroidOf(pj.polys));
    if (s.zsrc === "planned") out.zone = out.dB === null ? "-" : out.dB <= 50 ? "절대보호구역" : out.dB <= 200 ? "상대보호구역" : "보호구역 외";
    else out.zone = (out.dG !== null && out.dG <= 50) ? "절대보호구역" : (out.dB !== null && out.dB <= 200) ? "상대보호구역" : "보호구역 외";
    if (useOfficial(s)){

  LAYERS.forEach(d => {
    const want = ly.on.includes(d.id);
    if (want && !wms[d.id]) wms[d.id] = vwWms(d.layers, d.styles || d.layers, { pane: d.id === "cad" ? "cad" : "zone", minZoom:d.min, opacity: d.id === "cad" ? 1 : ly.op });
    if (wms[d.id]){
      if (want && !map.hasLayer(wms[d.id])) wms[d.id].addTo(map);
      if (!want && map.hasLayer(wms[d.id])) map.removeLayer(wms[d.id]);
      if (d.id !== "cad") wms[d.id].setOpacity(ly.op);
    }
  });
  hints();
}
function initMap(){

function hints(){

  const msg = LAYERS.filter(d => ly.on.includes(d.id) && z < d.min).map(d => d.name.split(" (")[0]);

function fitAll(quiet){
  const gs = [...state.project.map(p=>p.geom), ...state.schools.flatMap(s => s.parcels.map(p=>p.geom)), ...state.facs.flatMap(f => f.parcels.map(p=>p.geom))];
  const pts = gs.flatMap(ringsOf).flat();
  state.schools.forEach(s => s.gate && pts.push(s.gate));
  state.facs.forEach(f => f.point && pts.push(f.point));
  state.routes.forEach(r => pts.push(...r.pts));
  state.walks.forEach(r => pts.push(...r.pts));
  if (!pts.length){ if (!quiet) toast("아직 넣은 것이 없어요"); return; }
  const top = step === 4 ? 60 : 120;
  map.fitBounds(L.latLngBounds(pts.map(c => [c[1], c[0]])), { paddingTopLeft:[30,top], paddingBottomRight:[30,40] });

/* ===== 그릴 내용 (지도와 그림 저장이 같이 씀) ===== */
const DEFAULT_DISP = { near:true, project:true, site:true, zones:true, facs:true, routes:true, walks:true, dims:false };
const PRESETS = {
  loc:   { name:"위치도",     disp:{ near:true, project:true, site:true, zones:true, facs:false, routes:false, walks:false, dims:true } },
  zone:  { name:"보호구역도", disp:{ near:true, project:true, site:true, zones:true, facs:false, routes:false, walks:false, dims:false } },
  route: { name:"통학로도",   disp:{ near:true, project:true, site:true, zones:false, facs:false, routes:true, walks:true, dims:false } },
  fac:   { name:"주변시설도", disp:{ near:true, project:true, site:true, zones:false, facs:true, routes:false, walks:false, dims:false } }
};
function dispNow(){ return step === 4 ? (state.print.disp || PRESETS[state.print.preset].disp) : DEFAULT_DISP; }
const ST = {
  rel:  { color:"#2f6fdf", weight:2, dashArray:"6 5", fillColor:"#2f6fdf", fillOpacity:0.08 },
  abs:  { color:"#f08c00", weight:2, fillColor:"#f08c00", fillOpacity:0.2 },
  site: { color:"#2f6fdf", weight:2, fillColor:"#2f6fdf", fillOpacity:0.3 },
  proj: { color:"#e5484d", weight:3, fillColor:"#e5484d", fillOpacity:0.3 },
  r300: { color:"#6b7280", weight:1.5, dashArray:"2 6", fill:false },
  near: { color:"#3a3a3a", weight:1, fill:false }
};
function buildScene(disp){
  const items = [], labels = [], leg = new Set();
  const poly = (geom, style, pane) => items.push({ k:"poly", geom, style, pane });
  if (disp.near) nearFeats.forEach(f => { poly(f.geom, ST.near, "near"); if (f.label) labels.push({ k:"nlabel", pt:f.label, text:f.jibun }); });
  vecFeats.forEach(v => {
    if (v.kind === "bike"){ if (disp.walks){ items.push({ k:"line", coords:v.coords, style:{ color:"#0ca678", weight:4, opacity:0.9 }, pane:"near" }); leg.add("bike"); } }
    else if (disp.zones){ poly(v.geom, v.kind === "abs" ? ST.abs : ST.rel, "near"); leg.add(v.kind); }
  });
  state.schools.forEach(s => {
    const sh = showOf(s), gs = s.parcels.map(p => p.geom);
    if (r300On && gs.length){ const b3 = bufferOf(gs, 300); if (b3){ poly(b3.geometry, ST.r300); leg.add("r300"); } }
    if (disp.zones){
      if (useOfficial(s)){
        if (sh.rel && s.official.rel.length){ s.official.rel.forEach(g => poly(g, ST.rel)); leg.add("rel"); }
        if (sh.abs && s.official.abs.length){ s.official.abs.forEach(g => poly(g, ST.abs)); leg.add("abs"); }
      } else {
        if (sh.rel){ const rel = relZone(s); if (rel){ poly(rel.geometry, ST.rel); leg.add("rel"); } }
        if (sh.abs){ const abs = absZone(s); if (abs){ poly(abs.geometry, ST.abs); leg.add("abs"); } }
      }
    }
    if (disp.site && sh.site && gs.length){ gs.forEach(g => poly(g, ST.site)); leg.add("site"); }
    if (disp.site && s.gate && s.zsrc !== "planned") items.push({ k:"dot", pt:s.gate, r:6, color:"#f08c00" });
    if ((disp.site || disp.zones) && gs.length) labels.push({ k:"label", pt:centroidOf(gs), text:sName(s), color:"#2f6fdf" });
  });
  if (disp.facs) state.facs.forEach(f => {
    const c = FAC_TYPES[f.type].color;
    if (f.parcels.length){ f.parcels.forEach(p => poly(p.geom, { color:c, weight:2, fillColor:c, fillOpacity:0.25 })); labels.push({ k:"label", pt:centroidOf(f.parcels.map(p=>p.geom)), text:f.name, color:c }); leg.add("fac_"+f.type); }
    else if (f.point){ items.push({ k:"dot", pt:f.point, r:7, color:c }); labels.push({ k:"label", pt:f.point, text:f.name, color:c, dy:-22 }); leg.add("fac_"+f.type); }
  });
  if (disp.project && state.project.length){ state.project.forEach(p => poly(p.geom, ST.proj)); leg.add("proj"); labels.push({ k:"label", pt:centroidOf(state.project.map(p=>p.geom)), text:"사업지", color:"#e5484d" }); }
  if (disp.walks) state.walks.forEach(r => {
    if (!r.pts.length) return;
    items.push({ k:"line", coords:r.pts, style:{ color:"#868e96", weight:7, opacity:0.75 } }); leg.add("walk");
    if (r.pts.length > 1){ const i = Math.floor((r.pts.length-1)/2), a = r.pts[i], b = r.pts[i+1];
      labels.push({ k:"label", pt:[(a[0]+b[0])/2, (a[1]+b[1])/2], text:`${r.name}${r.width ? " " + r.width + "m" : ""}`, color: r.width && r.width < 2 ? "#c42b2b" : "#5c636a" }); }
  });
  if (disp.routes) state.routes.forEach(r => {
    if (!r.pts.length) return;
    items.push({ k:"line", coords:r.pts, style:{ color:"#d6336c", weight:4, opacity:0.9 } }); leg.add("route");
    r.pts.forEach((p,i) => items.push({ k:"dot", pt:p, r: i===0||i===r.pts.length-1 ? 6 : 3.5, color:"#d6336c" }));
    if (r.pts.length > 1){ const i = Math.floor((r.pts.length-1)/2), a = r.pts[i], b = r.pts[i+1];
      labels.push({ k:"label", pt:[(a[0]+b[0])/2, (a[1]+b[1])/2], text:`약 ${fmt(routeLen(r))}m`, color:"#d6336c" }); }
  });
  if (disp.dims && state.project.length) state.schools.forEach(s => {
    if (!s.parcels.length) return;
    let best = { d:Infinity };
    state.project.forEach(pp => s.parcels.forEach(sp => { if (intersects(pp.geom, sp.geom)) return; const r = nearestPairG(pp.geom, sp.geom); if (r.d < best.d) best = r; }));
    if (best.d < Infinity){
      items.push({ k:"line", coords:[best.a, best.b], style:{ color:"#1f2328", weight:1.6, dashArray:"5 4", opacity:1 } });
      items.push({ k:"dot", pt:best.a, r:3, color:"#1f2328" }); items.push({ k:"dot", pt:best.b, r:3, color:"#1f2328" });
      labels.push({ k:"dim", pt:[(best.a[0]+best.b[0])/2, (best.a[1]+best.b[1])/2], text:`약 ${fmt(best.d)}m` });
    }
  });
  return { items, labels, leg };
}
const LEG = {
  proj:["사업지","background:rgba(229,72,77,.35);border:2px solid #e5484d"],
  site:["교지","background:rgba(47,111,223,.35);border:2px solid #2f6fdf"],
  abs:["절대보호구역","background:rgba(240,140,0,.25);border:2px solid #f08c00"],
  rel:["상대보호구역","background:rgba(47,111,223,.08);border:2px dashed #2f6fdf"],
  r300:["교지경계 300m","border:2px dotted #6b7280"],

  route:["통학로","background:#d6336c;height:4px;vertical-align:3px"]
};
function legendItems(leg){
  const out = [];
  ["proj","site","abs","rel","r300"].forEach(k => leg.has(k) && out.push(LEG[k]));
  Object.entries(FAC_TYPES).forEach(([k,t]) => leg.has("fac_"+k) && out.push([t.name, `background:${t.color}`]));
  ["walk","bike","route"].forEach(k => leg.has(k) && out.push(LEG[k]));
  return out;
}
let lastScene = null;
function redraw(){
  if (!map) return;
  drawLayer.clearLayers(); nearLayer.clearLayers(); vecLayer.clearLayers();
  const sc = lastScene = buildScene(dispNow());
  const ll = c => [c[1], c[0]];
  sc.items.forEach(it => {
    const grp = it.pane === "near" ? (it.k === "poly" && it.style === ST.near ? nearLayer : vecLayer) : drawLayer;
    if (it.k === "poly") L.geoJSON(it.geom, { style:() => it.style, interactive:false, pane: it.pane || "overlayPane" }).addTo(grp);
    else if (it.k === "line") L.polyline(it.coords.map(ll), { ...it.style, interactive:false, lineCap:"butt", pane: it.pane || "overlayPane" }).addTo(grp);
    else if (it.k === "dot") L.circleMarker(ll(it.pt), { radius:it.r, interactive:false, color:"#fff", weight:2, fillColor:it.color, fillOpacity:1 }).addTo(drawLayer);
  });
  sc.labels.forEach(lb => {
    const html = lb.k === "nlabel" ? `<div class="nearLbl">${esc(lb.text)}</div>`
      : lb.k === "dim" ? `<div class="lbl" style="background:#fff;color:#1f2328;border:1px solid #1f2328">${esc(lb.text)}</div>`
      : `<div class="lbl" style="background:${lb.color}${lb.dy ? `;transform:translate(-50%,calc(-50% + ${lb.dy}px))` : ""}">${esc(lb.text)}</div>`;
    L.marker(ll(lb.pt), { interactive:false, pane: lb.k === "nlabel" ? "near" : "markerPane", icon:L.divIcon({ className:"", iconSize:null, html }) }).addTo(lb.k === "nlabel" ? nearLayer : drawLayer);
  });
  renderLegends();
}
function legendHtml(){ const it = lastScene ? legendItems(lastScene.leg) : []; return it.length ? `<b>범 례</b>${it.map(([n,s]) => `<div><i style="${s}"></i>${esc(n)}</div>`).join("")}` : ""; }
function renderLegends(){

  const lg = $("#legend");
  lg.innerHTML = h || `<b>범례</b><div class="muted">표시할 항목이 없어요</div>`;

}

async function drawVec(kind){
  if (kind === "clear"){ vecFeats = vecFeats.filter(() => false); vecStat = ""; redraw(); renderLayerPanel(); return; }
  if (map.getZoom() < 14){ toast("조금 더 확대한 뒤 눌러 주세요 (동네 정도)"); return; }
  const b = map.getBounds(), bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
  const nm = kind === "zone" ? "보호구역" : "자전거길";
  toast("자료 받는 중…", 15000);
  let fs;
  try { fs = await vwFeaturesInBox(kind === "zone" ? "LT_C_UO101" : "LT_L_BYCYCLE01", bbox, 3); }
  catch(e){ vecStat = `${nm}: 브이월드 오류 — ${e.message}`; toast(vecStat, 6000); renderLayerPanel(); return; }
  $("#toast").style.display = "none";
  if (!fs.length){ vecStat = `${nm}: 이 화면 범위에는 브이월드 자료가 없어요`; toast(vecStat, 4000); renderLayerPanel(); return; }
  if (kind === "zone"){
    vecFeats = vecFeats.filter(v => v.kind === "bike");
    fs.map(f => ({ geom:f.geometry, kind:zoneKind(f.properties, f.geometry), a:turf.area(turf.feature(f.geometry)) })).sort((x,y) => y.a - x.a).forEach(v => vecFeats.push(v));
    const na = vecFeats.filter(v => v.kind === "abs").length, nr = vecFeats.filter(v => v.kind === "rel").length;
    const sample = zoneText(fs[0].properties);
    vecStat = `보호구역 ${fs.length}개 (절대 ${na} · 상대 ${nr})${sample ? " · 자료 이름 예: " + sample : " · 자료에 절대/상대 이름이 없어 크기로 구분했어요"}`;
  } else {
    vecFeats = vecFeats.filter(v => v.kind !== "bike");
    fs.forEach(f => { const g = f.geometry; const lines = g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : []; lines.forEach(c => vecFeats.push({ kind:"bike", coords:c })); });
    vecStat = `자전거길 ${fs.length}개 구간`;
  }
  redraw(); toast(vecStat, 4000); renderLayerPanel();
}

let autoRes = [], autoType = "";
async function autoFind(type){
  const sch = state.schools.filter(s => s.parcels.length || s.gate);
  if (!sch.length){ toast("학교 교지나 교문을 먼저 넣어 주세요 (2단계)"); return; }
  const R = type === "park" ? 500 : 800;
  const buf = bufferOf(sch.flatMap(s => s.parcels.length ? s.parcels.map(p=>p.geom) : [turf.point(s.gate).geometry]), R);
  toast("주변 시설 찾는 중…", 15000);
  let fs;
  try { fs = await vwFeaturesInBox(type === "park" ? "LT_C_UPISUQ153" : "LT_C_UPISUQ155", turf.bbox(buf), 2); }
  catch(e){ toast("찾기 실패: " + e.message, 5000); return; }

    let d = Infinity;
    sch.forEach(s => { const x = shapeDist(schoolShape(s), { polys:[f.geometry], pt:null }); if (x !== null) d = Math.min(d, x); });
    return { i, type, name: p.dgm_nm || p.alias || p.uname || "이름 없음", cat: p.uname || p.ucode || "", geom:f.geometry, d };
  }).filter(r => r.d <= R && !(type === "cult" && r.d === 0)).sort((a,b) => a.d - b.d).slice(0, 15);
  renderPanel();
  if (!autoRes.length) toast("근처에서 찾지 못했어요. 지도에서 직접 지정해 주세요", 3500);
}

  schoolCands = fs.map((f, i) => {
    const p = f.properties || {}, txt = Object.values(p).join(" ");
    const name = p.dgm_nm || p.alias || p.uname || "이름 없음";
    return { i, name, txt, geom:f.geometry, d: setDist(pj, [f.geometry]) };
  }).filter(c => /학교|유치원|초등|중학|고등/.test(c.txt) && c.d <= 300 && !state.schools.some(s => s.name === c.name))
    .sort((a,b) => a.d - b.d);
  renderPanel();
  if (!schoolCands.length) toast("300m 안에서 학교 자료를 찾지 못했어요. '직접 추가'로 넣어 주세요", 4000);
}
function guessKind(n){ return /유치원/.test(n) ? "유치원" : /초등/.test(n) ? "초등학교" : /중학/.test(n) ? "중학교" : /고등/.test(n) ? "고등학교" : /특수/.test(n) ? "특수학교" : "기타"; }
function shortName(n){ return n.replace(/등학교$/, "").replace(/학교$/, "").replace(/유치원$/, "유"); }

/* ===== 지도 클릭 ===== */
async function onMapClick(lng, lat){
  map.closePopup();
  $("#results").style.display = "none";
  if (mode && mode.type === "gate"){
    const s = findS(mode.id);
    if (s){ s.gate = [lng, lat]; changed(); toast(`${sName(s)} 교문을 찍었어요`); }
    setMode(null); return;
  }
  if (mode && mode.type === "facPt"){
    const f = findF(mode.id);
    if (f){ f.point = [lng, lat]; f.parcels = []; changed(); toast(`${f.name} 위치를 찍었어요`); }
    setMode(null); return;
  }
  if (mode && (mode.type === "route" || mode.type === "walk")){
    const r = findL(mode.id);
    if (r){ r.pts.push([lng, lat]); changed(); updateModeText(); }
    return;
  }
  if (step === 4 && !mode) return;
  toast("필지 확인 중…", 8000);
  let p;
  try { p = await parcelAt(lng, lat); }
  catch(e){ toast("브이월드 조회 실패: " + e.message, 5000); return; }
  if (!p){ toast("이 자리에 필지 정보가 없어요"); return; }
  $("#toast").style.display = "none";
  if (mode && mode.type === "project") toggle(state.project, p, "사업지");
  else if (mode && mode.type === "school"){ const s = findS(mode.id); if (s) toggle(s.parcels, p, sName(s)); }
  else if (mode && mode.type === "facP"){ const f = findF(mode.id); if (f){ f.point = null; toggle(f.parcels, p, f.name); } }
  else {
    const ez = await eduZoneAt(lng, lat);
    popup.setLatLng([lat, lng]).setContent(`<div class="iw"><b>${esc(p.addr)}</b><br>지목 ${esc(p.jimok || "-")} · ${esc(p.zone || "용도지역 정보 없음")}<br>${ez ? `<span style="color:#9a5b00">교육환경보호구역: ${esc(ez)}</span><br>` : ""}${p.jiga ? `공시지가 ${fmt(p.jiga)}원/㎡${p.year ? ` (${esc(p.year)})` : ""}<br>` : ""}<span style="color:#6b7280">도면면적 약 ${fmt(areaOf([p.geom]))}㎡</span></div>`).openOn(map);
  }
}
function toggle(list, p, label){
  const i = list.findIndex(x => x.pnu === p.pnu);
  if (i >= 0){ list.splice(i,1); toast(`${label}에서 뺐어요`); }
  else { list.push(p); toast(`${label}에 넣었어요`); }
  changed();
}
function changed(){ save(); redraw(); renderPanel(); if ($("#layerPanel").style.display === "block") renderLayerPanel(); }
function updateModeText(){
  const m = mode; if (!m) return;
  const s = m.id && findS(m.id), f = m.id && findF(m.id), r = m.id && findL(m.id);
  $("#modeText").textContent =
    m.type === "project" ? "사업지 필지를 눌러 넣고 빼세요" :
    m.type === "school" ? `${sName(s)} 교지 필지를 눌러 넣고 빼세요` :
    m.type === "gate" ? `${sName(s)} 교문(출입문) 위치를 한 번 누르세요` :
    m.type === "facP" ? `${f.name} 필지를 눌러 넣고 빼세요` :
    m.type === "facPt" ? `${f.name} 위치를 한 번 누르세요` :
    m.type === "walk" ? `보도를 따라 점을 찍으세요 · 지금 약 ${fmt(routeLen(r))}m` :
    `출발점부터 교문까지 길을 따라 점을 찍으세요 · 지금 약 ${fmt(routeLen(r))}m`;
  $("#modeUndo").style.display = m.type === "route" || m.type === "walk" ? "inline-block" : "none";
}
function setMode(m){
  mode = m;
  if (!m){ $("#modeBar").style.display = "none"; renderPanel(); return; }
  updateModeText(); $("#modeBar").style.display = "flex"; renderPanel();
}
const on = (t, id) => mode && mode.type === t && (!id || mode.id === id) ? "on" : "";

/* ===== 단계 레일 ===== */
function stepDone(n){
  if (n === 1) return state.project.length > 0;
  if (n === 2) return state.schools.length > 0 && state.schools.every(s => s.parcels.length || s.gate);
  if (n === 3) return state.schools.length > 0 && checkItems().every(it => it.ok);
  return false;
}
function renderRail(){
  $("#rail").innerHTML = STEPS.map((n, i) => {
    const k = i + 1, cur = k === step, done = !cur && stepDone(k);
    return `<button class="rstep ${cur ? "cur" : ""} ${done ? "done" : ""}" data-step="${k}" aria-current="${cur ? "step" : "false"}"><span class="dot">${done ? "✓" : k}</span><span class="nm">${n}</span></button>`;
  }).join("");
  $("#tbName").textContent = state.name;
}
function goStep(n){
  step = n; ls("eduMap.step", n);
  if (mode) mode = null; $("#modeBar").style.display = "none";
  autoRes = []; schoolCands = [];
  layoutFrame(); redraw(); renderRail(); renderPanel(); hints();
  $("#panel").scrollTop = 0;
}
function layoutFrame(){
  const fr = $("#frame"), wrap = $("#mapWrap");
  if (step === 4){
    const W = wrap.clientWidth - 48, H = wrap.clientHeight - 48, r = state.print.paper === "land" ? 297/210 : 210/297;
    const w = Math.max(200, Math.min(W, H * r)), h = w / r;
    fr.className = "print"; fr.style.width = w + "px"; fr.style.height = h + "px";
    wrap.classList.add("printing");
    $("#pTitle").textContent = state.print.title; $("#pTitle").style.display = state.print.title ? "block" : "none";
    $("#pNorth").style.display = "block";
    toggleLayerPanel(false);
  } else {
    fr.className = ""; fr.style.width = ""; fr.style.height = "";
    wrap.classList.remove("printing");
    $("#pTitle").style.display = "none"; $("#pNorth").style.display = "none";
  }
  if (map) setTimeout(() => map.invalidateSize(), 30);
}

const nextBtn = (n, label) => n <= 5 ? `<button class="btn pri full next" data-step="${n}" style="height:46px;font-size:15px">${label}</button>` : "";
function renderPanel(){
  renderRail();

}

  const st = s => `stroke="${s.color}" stroke-width="${s.weight || 1}" ${s.dashArray ? `stroke-dasharray="${s.dashArray}"` : ""} stroke-opacity="${s.opacity ?? 1}" ${s.fill === false ? 'fill="none"' : `fill="${s.fillColor || "none"}" fill-opacity="${s.fillOpacity ?? 0.2}"`}`;
  const out = [`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${font}">`, `<rect width="${W}" height="${H}" fill="#ffffff"/>`];
  sc.items.forEach(it => {
    if (it.k === "poly") polysOf(it.geom).forEach(poly => out.push(`<path fill-rule="evenodd" d="${poly.map(r => "M" + r.map(P).join("L") + "Z").join(" ")}" ${st(it.style)} stroke-linejoin="round"/>`));
    else if (it.k === "line") out.push(`<polyline points="${it.coords.map(P).join(" ")}" ${st({ ...it.style, fill:false })} stroke-linejoin="round"/>`);
    else if (it.k === "dot"){ const [x,y] = P(it.pt).split(","); out.push(`<circle cx="${x}" cy="${y}" r="${it.r}" fill="${it.color}" stroke="#fff" stroke-width="2"/>`); }
  });
  const showN = map.getZoom() >= 17;
  sc.labels.forEach(lb => {
    let [x, y] = P(lb.pt).split(",").map(Number); y += lb.dy || 0;
    if (lb.k === "nlabel"){ if (showN) out.push(`<text x="${x}" y="${y + 3}" font-size="${lfs - 2}" text-anchor="middle" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(lb.text)}</text>`); return; }
    const w = textW(lb.text, lfs) + 16, h = lfs + 10;
    const dim = lb.k === "dim";
    out.push(`<rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${dim ? "#ffffff" : lb.color}" ${dim ? 'stroke="#1f2328"' : ""}/>`);
    out.push(`<text x="${x}" y="${y + lfs*0.36}" font-size="${lfs}" font-weight="700" text-anchor="middle" fill="${dim ? "#1f2328" : "#ffffff"}">${esc(lb.text)}</text>`);
  });
  // 제목
  if (state.print.title){ const tw = textW(state.print.title, 14) + 24; out.push(`<rect x="12" y="12" width="${tw}" height="30" fill="#fff" stroke="#c9ced6"/><text x="${12 + tw/2}" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">${esc(state.print.title)}</text>`); }
  // 방위표
  out.push(`<g transform="translate(${W - 27} 14)"><path d="M13 2 L22 30 L13 24 L4 30 Z" fill="#1f2328"/><text x="13" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">N</text></g>`);
  // 축척
  const y0 = H / 2, mpp = map.distance(map.containerPointToLatLng([0, y0]), map.containerPointToLatLng([100, y0])) / 100;
  const nice = [5,10,20,25,50,100,200,250,500,1000,2000].find(v => v / mpp >= 70) || 2000, px = nice / mpp;
  out.push(`<g transform="translate(16 ${H - 22})"><rect width="${px/2}" height="6" fill="#1f2328"/><rect x="${px/2}" width="${px/2}" height="6" fill="#fff" stroke="#1f2328"/><text y="-5" font-size="11" fill="#1f2328">0</text><text x="${px}" y="-5" font-size="11" text-anchor="end" fill="#1f2328">${nice >= 1000 ? nice/1000 + "km" : nice + "m"}</text></g>`);
  // 범례
  const li = legendItems(sc.leg);
  if (li.length){
    const lw = Math.max(...li.map(([n]) => textW(n, 12))) + 50, lh = 30 + li.length * 21, lx = W - lw - 12, ly0 = H - lh - 12;
    out.push(`<rect x="${lx}" y="${ly0}" width="${lw}" height="${lh}" fill="#fff" stroke="#c9ced6"/><text x="${lx + 12}" y="${ly0 + 20}" font-size="12" font-weight="700" fill="#1f2328">범 례</text>`);
    li.forEach(([n, css], i) => {
      const yy = ly0 + 32 + i * 21, line = /height:\s*[46]px/.test(css);
      const bg = (css.match(/background:([^;]+)/) || [])[1], bd = (css.match(/border:\s*2px\s+(\w+)\s+(#[0-9a-f]+)/i) || []);
      if (line) out.push(`<rect x="${lx + 12}" y="${yy + 4}" width="20" height="5" fill="${bg}"/>`);
      else out.push(`<rect x="${lx + 12}" y="${yy}" width="20" height="12" fill="${bg ? bg.replace(/rgba?\(([^)]+)\)/, (m) => m) : "none"}" ${bd[2] ? `stroke="${bd[2]}" stroke-width="2" ${bd[1] === "dashed" ? 'stroke-dasharray="4 3"' : bd[1] === "dotted" ? 'stroke-dasharray="1.5 3"' : ""}` : ""}/>`);
      out.push(`<text x="${lx + 40}" y="${yy + 11}" font-size="12" fill="#1f2328">${esc(n)}</text>`);
    });
  }
  out.push(`</svg>`);
  return { svg: out.join(""), W, H };
}
function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function fileBase(){ return (state.print.title || state.name || "위치도").replace(/[<>:"/\\|?*]/g, "").trim() || "위치도"; }
function exportImage(kind){

  const { svg, W, H } = buildSVG();
  if (kind === "svg"){ download(new Blob([svg], { type:"image/svg+xml" }), fileBase() + ".svg"); toast("SVG로 저장했어요"); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"), k = 3; c.width = W * k; c.height = H * k;
    const g = c.getContext("2d"); g.scale(k, k); g.drawImage(img, 0, 0);
    c.toBlob(b => { download(b, fileBase() + ".png"); toast("그림으로 저장했어요"); }, "image/png");
  };
  img.onerror = () => toast("그림 만들기에 실패했어요. SVG로 저장해 보세요");

}

  { id:"pre",    name:"프리텐다드",        fam:'"Pretendard",sans-serif', css:"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" },
  { id:"noto",   name:"본고딕 (Noto Sans)", fam:'"Noto Sans KR",sans-serif', css:GF("Noto+Sans+KR:wght@400;600;700") },
  { id:"nanum",  name:"나눔고딕",          fam:'"Nanum Gothic",sans-serif', css:GF("Nanum+Gothic:wght@400;700;800") },
  { id:"ibm",    name:"IBM 플렉스 산스",    fam:'"IBM Plex Sans KR",sans-serif', css:GF("IBM+Plex+Sans+KR:wght@400;600;700") },
  { id:"gowun",  name:"고운돋움",          fam:'"Gowun Dodum",sans-serif', css:GF("Gowun+Dodum") },
  { id:"myeong", name:"나눔명조",          fam:'"Nanum Myeongjo",serif', css:GF("Nanum+Myeongjo:wght@400;700;800") }
];
let ui = { font:"sys", size:15, lbl:12, ...(ls("eduMap.ui") || {}) };
function applyUI(){
  const f = FONTS.find(x => x.id === ui.font) || FONTS[0];
  if (f.css && !document.querySelector(`link[data-font="${f.id}"]`)){ const l = document.createElement("link"); l.rel = "stylesheet"; l.href = f.css; l.dataset.font = f.id; document.head.appendChild(l); }
  document.documentElement.style.setProperty("--font", f.fam);
  document.documentElement.style.setProperty("--lblfs", ui.lbl + "px");
  $("#panel").style.zoom = ui.size / 15;
  ls("eduMap.ui", ui);
}
$("#fontSel").innerHTML = FONTS.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
$("#fontSel").value = ui.font; $("#sizeSel").value = String(ui.size); $("#lblSel").value = String(ui.lbl);
$("#fontSel").onchange = e => { ui.font = e.target.value; applyUI(); };
$("#sizeSel").onchange = e => { ui.size = Number(e.target.value); applyUI(); };
$("#lblSel").onchange = e => { ui.lbl = Number(e.target.value); applyUI(); };
$("#setBtn").onclick = () => { const p = $("#pop"); p.style.display = p.style.display === "flex" ? "none" : "flex"; };
document.addEventListener("mousedown", e => { const p = $("#pop"); if (p.style.display === "flex" && !p.contains(e.target) && e.target.id !== "setBtn") p.style.display = "none"; });
applyUI();

/* ===== 시작 ===== */
initMap();
layoutFrame(); redraw(); renderPanel(); hints();
</script>
</body>
</html>
