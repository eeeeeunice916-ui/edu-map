<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육환경 위치도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --sub:#5b6470; --line:#e3e6ea; --soft:#f6f7f9; --blue:#2f6fdf; --blueSoft:#eef3fc; --blueInk:#2459c4;
  --proj:#e5484d; --gate:#f08c00; --ok:#1a7f37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif);font-size:15px}
button,input,select,textarea{font-family:inherit}
/* 틀 */
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:relative}
#topbar .brand{font-weight:700;font-size:16px;white-space:nowrap}
#topbar .pname{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#saved{font-size:12px;color:var(--ok);background:#eaf6ec;padding:2px 8px;border-radius:10px;white-space:nowrap}
#main{flex:1;display:flex;min-height:0}
#rail{width:88px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:12px 8px;background:#fbfcfd}
.rstep{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;border:none;background:transparent;color:#4a5260;cursor:pointer}
.rstep .dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#e9ecef;color:#4a5260}
.rstep .nm{font-size:12px;font-weight:500}
.rstep.cur{background:var(--blueSoft);color:var(--blueInk)}
.rstep.cur .dot{background:var(--blue);color:#fff}
.rstep.done .dot{background:#d7ecdc;color:var(--ok)}
#mapWrap{flex:1;position:relative;min-width:0;background:#eef0f3}
#frame{position:absolute;inset:0}
#frame.print{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(0,0,0,.14);background:#fff}
#map{position:absolute;inset:0;background:#f2f3f5}
.leaflet-container{font-family:inherit}
#panel{width:430px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1000px){
  #main{flex-direction:column}
  #rail{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);padding:6px;overflow-x:auto}
  .rstep{flex:1;min-width:64px;padding:6px 4px}
  #mapWrap{flex:none;height:55vh}
  #panel{width:auto;border-left:none;border-top:1px solid var(--line);flex:1}
}
/* 공통 컨트롤 */
.btn{height:40px;padding:0 14px;border-radius:9px;border:1px solid #d6dae0;background:#fff;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f7f9}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:#2a62c8}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{height:34px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.on{background:var(--blueSoft);border-color:var(--blue);color:var(--blueInk)}
.btn.full{width:100%}
.btn.dashed{border-style:dashed;border-color:#b9c3d3;background:#f7f9fc;color:var(--blueInk)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid #d6dae0;border-radius:9px;overflow:hidden}
.seg button{height:36px;border:none;border-left:1px solid #d6dae0;background:#fff;font-size:13px;color:var(--ink);cursor:pointer;padding:0 4px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--blue);color:#fff}
.inp{height:38px;border:1px solid #d6dae0;border-radius:8px;padding:0 10px;font-size:14px;width:100%;background:#fff}
.inp.sm{height:32px;font-size:13.5px;padding:0 8px}
select.inp{padding:0 6px}
.lab{font-size:13px;color:#4a5260;margin-bottom:4px;display:block}
.muted{color:var(--sub);font-size:13px;line-height:1.55}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.card.hl{border-color:#c9d8f5;background:#fbfcff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parcel{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.parcel:last-child{border-bottom:none}
.parcel .t{flex:1;line-height:1.45;min-width:0}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:#4a5260;white-space:nowrap}
.badge.abs{background:#fff1e0;color:#9a5b00}
.badge.rel{background:var(--blueSoft);color:var(--blueInk)}
.badge.out{background:#eaf6ec;color:var(--ok)}
.badge.bad{background:#fdecec;color:#c42b2b}
.stepHead .no{font-size:12.5px;color:var(--sub)}
.stepHead h2{margin:2px 0 0;font-size:20px}
.sumbox{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:76px minmax(0,1fr);row-gap:6px;font-size:14px}
.sumbox .k{color:var(--sub)}
.next{margin-top:auto}
.prog{height:6px;background:#e9ecef;border-radius:3px}
.prog i{display:block;height:6px;background:var(--blue);border-radius:3px}
.item{border:1px solid var(--line);border-radius:12px;background:#fff}
.item.open{border-color:#c9d8f5;background:#fbfcff}
.ihead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:none;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.ihead .sd{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sd.ok{background:#d7ecdc;color:var(--ok)}
.sd.todo{background:#fff1e0;color:#9a5b00}
.ihead .tt{flex:1;min-width:0}
.ihead .tt b{font-size:14px;font-weight:600;display:block}
.ihead .tt span{font-size:12px;color:var(--sub)}
.ihead .vv{font-size:12.5px;text-align:right;white-space:pre-line;color:var(--ink)}
.ibody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.res{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px;line-height:1.5}
.res .s{font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 12px;border-radius:8px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:600}
td.l{text-align:left}
td[contenteditable]{background:#fffdf3;outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.sent{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.stg{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12.5px}
.stg input[type=color]{width:100%;height:30px;border:1px solid #d6dae0;border-radius:6px;padding:2px;background:#fff}
.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.palb{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid #d6dae0;border-radius:8px;background:#fff;font-size:12.5px;cursor:pointer;text-align:left;color:var(--ink)}
.palb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palb.on{border-color:var(--blue);background:var(--blueSoft)}
.postBox{transform:translate(-50%,-50%);background:#fff;border:1.5px solid #495057;border-radius:6px;padding:3px 5px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:move}
.postBox .pi{display:flex;gap:2px}
.postBox .pn{font-size:var(--lblfs,12px);font-weight:700;color:#fff;background:#2f9e44;border-radius:3px;padding:0 5px;white-space:nowrap}
.ovWrap{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ovImg{position:absolute;transform-origin:50% 50%;max-width:none;pointer-events:none;user-select:none}
.roadg{display:grid;grid-template-columns:34px minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:12.5px}
.roadg .h{color:var(--sub);text-align:center}
/* 지도 위 */
.top{position:absolute;left:12px;right:12px;top:12px;z-index:1000}
.searchRow{display:flex;gap:6px}
.searchRow input{flex:1;min-width:0;height:42px;border:1px solid #d6dae0;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:520px}
.results div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.results div:hover{background:var(--soft)}
.results small{color:var(--sub)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#frame.print ~ .top, #mapWrap.printing .top{display:none}
body.bgshot #map .leaflet-overlay-pane, body.bgshot #map .leaflet-marker-pane, body.bgshot #map .leaflet-near-pane, body.bgshot #map .leaflet-tooltip-pane, body.bgshot #map .leaflet-popup-pane, body.bgshot #map .leaflet-control-container, body.bgshot #pTitle, body.bgshot #pNorth, body.bgshot #pLegend, body.bgshot #toast, body.bgshot #mapMsg{visibility:hidden !important}
#modeBar{position:absolute;left:12px;bottom:14px;z-index:1000;display:none;align-items:center;gap:8px;max-width:calc(100% - 24px);
  background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#modeBar span{font-size:14px;line-height:1.35}
#modeBar button{background:#fff;color:var(--ink);border:none;border-radius:8px;height:32px;padding:0 12px;font-size:13.5px;cursor:pointer}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:3000;display:none;max-width:90vw}
#zoneHint{position:absolute;left:12px;bottom:40px;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub);display:none}
#mapMsg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:1200;display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;line-height:1.6;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#legend,#pLegend{position:absolute;right:12px;bottom:46px;z-index:900;background:rgba(255,255,255,.96);border:1px solid #c9ced6;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.85;display:none}
#pLegend{border-radius:0;bottom:12px}
#legend i,#pLegend i{display:inline-block;width:18px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px}
#pTitle{position:absolute;left:12px;top:12px;z-index:900;background:#fff;border:1px solid #c9ced6;padding:6px 12px;font-size:14px;font-weight:700;display:none}
#pNorth{position:absolute;right:14px;top:12px;z-index:900;display:none}
#layerPanel{position:absolute;right:12px;top:104px;z-index:1001;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 170px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
#layerPanel h4{margin:12px 0 4px;font-size:12px;color:var(--sub)}
#layerPanel label{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.lgsw{width:12px;height:12px;border-radius:2px;flex:none}
.nearLbl{transform:translate(-50%,-50%);font-size:calc(var(--lblfs,12px) - 2px);color:#222;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff}
.zlo .nearLbl{display:none}
.lbl{transform:translate(-50%,-50%);color:#fff;font-size:var(--lblfs,12px);padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:600;display:inline-block}
.iw{padding:4px 2px;font-size:13px;line-height:1.5}
/* 팝업 상자 */
#pop{position:absolute;right:18px;top:52px;z-index:2000;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:14px;display:none;flex-direction:column;gap:10px}
#dlgBack{position:fixed;inset:0;background:rgba(20,24,30,.35);z-index:2500;display:none;align-items:center;justify-content:center;padding:16px}
#dlg{width:560px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.plist{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.plist.cur{border-color:var(--blue);background:#fbfcff}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">교육환경 위치도</div>
    <div style="color:#c3c8cf">/</div>
    <div class="pname" id="tbName"></div>
    <div id="saved">자동 저장됨</div>
    <div style="flex:1"></div>
    <button class="btn sm" id="btnProjects">사업 목록</button>
    <button class="btn sm" id="setBtn">글씨체·크기</button>
    <div id="pop">
      <div><label class="lab" for="fontSel">글씨체</label><select class="inp" id="fontSel"></select></div>
      <button class="btn sm" id="btnLocalFonts">내 컴퓨터 글씨체 불러오기</button>
      <div class="row" style="flex-wrap:nowrap"><input class="inp sm" id="fontName" placeholder="글씨체 이름 직접 입력 (예: 맑은 고딕)" aria-label="글씨체 이름"><button class="btn sm" id="fontNameBtn">적용</button></div>
      <div><label class="lab" for="sizeSel">패널 글씨 크기</label>
        <select class="inp" id="sizeSel"><option value="13">작게</option><option value="15">보통</option><option value="17">크게</option><option value="19">아주 크게</option></select></div>
      <div><label class="lab" for="lblSel">지도 위 글씨 크기</label>
        <select class="inp" id="lblSel"><option value="10">작게</option><option value="12">보통</option><option value="14">크게</option><option value="17">아주 크게</option></select></div>
      <div class="muted">바탕지도의 지명·도로명은 브이월드 그림이라 바뀌지 않아요. 학교명·시설명·지번·거리 표시는 바뀌어요.</div>
    </div>
  </header>
  <div id="main">
    <nav id="rail" aria-label="작업 단계"></nav>
    <div id="mapWrap">
      <div id="frame">
        <div id="map"></div>
        <div id="pTitle"></div>
        <div id="pLegend"></div>
        <div id="pNorth" aria-hidden="true"><svg width="26" height="44" viewBox="0 0 26 44"><path d="M13 2 L22 30 L13 24 L4 30 Z" fill="#1f2328"/><text x="13" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">N</text></svg></div>
      </div>
      <div id="mapMsg"></div>
      <div class="top">
        <div class="searchRow">
          <input id="q" placeholder="주소·지번·학교·시설 이름 검색" enterkeyhint="search" aria-label="검색">
          <button class="btn dark" id="qBtn">검색</button>
        </div>
        <div class="results" id="results" style="display:none"></div>
        <div class="chips">
          <button class="chip" id="chipLayer">레이어</button>
          <button class="chip" id="chip300">300m 범위</button>
          <button class="chip" id="chipDim">이격거리</button>
          <button class="chip" id="chipSnap">자석</button>
          <button class="chip" id="chipLeg">범례</button>
          <button class="chip" id="chipFit">전체 보기</button>
        </div>
      </div>
      <div id="legend"></div>
      <div id="layerPanel"></div>
      <div id="zoneHint"></div>
      <div id="modeBar"><span id="modeText"></span><button id="modeSnap" style="display:none">자석</button><button id="modeUndo" style="display:none">되돌리기</button><button id="modeDone">완료</button></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<div id="dlgBack"><div id="dlg" role="dialog" aria-modal="true" aria-label="사업 목록"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<input type="file" id="icoIn" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">
<input type="file" id="ovIn" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp" style="display:none">
<div id="toast"></div>

<script>
/* ===== 설정 ===== */
const APP_VERSION = "3.9";
const VW_KEY = "1C3C3956-A882-416D-8DE7-3A232A4B096B";
const DOMAIN = location.origin;            // 브이월드에 등록한 서비스URL과 같아야 함
const KINDS = ["유치원","초등학교","중학교","고등학교","특수학교","기타"];
const WALK_SPEED = 0.7;                    // m/s (평가서 기준)
const FAC_TYPES = {
  park:  { name:"공원·녹지",            color:"#2e9e4f" },
  cult:  { name:"도서관·문화·체육시설",  color:"#8e44ad" },
  gateA: { name:"단지 출입구",          color:"#c2255c" },
  cons:  { name:"공사차량 출입구",       color:"#8d5a2b" },
  haz:   { name:"위험·유해시설",         color:"#212529" },
  etc:   { name:"기타",                 color:"#495057" }
};
const GRADE = ["", "매우미흡", "미흡", "보통", "우수", "매우우수"];
const STEPS = ["사업지", "대상학교", "위치항목", "위치도", "결과"];
const ROAD_FN = ["", "주간선", "보조간선", "집산", "국지"];
const DIR4 = [["E","동측"],["W","서측"],["S","남측"],["N","북측"]];

/* ===== 공통 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const m1 = n => (Math.round(n*10)/10).toLocaleString("ko-KR", { minimumFractionDigits:1, maximumFractionDigits:1 });
const uid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e4);
let toastT;
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none", ms); }
function josa(word, a, b){ const c = String(word).trim().slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return a+"("+b+")"; return (c-0xAC00)%28 ? b : a; }
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function uniq(a){ return [...new Set(a.filter(Boolean))]; }

/* ===== 브이월드 (JSONP) ===== */
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cb = "vwcb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); reject(new Error("응답 시간 초과")); }, 12000);
    window[cb] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("불러오기 실패")); };
    sc.src = url + "?" + qs;
    document.head.appendChild(sc);
  });
}
async function vwData(layer, extra){
  const d = await jsonp("https://api.vworld.kr/req/data", {
    service:"data", version:"2.0", request:"GetFeature", data:layer, key:VW_KEY, domain:DOMAIN,
    format:"json", errorformat:"json", size:10, page:1, geometry:"true", attribute:"true", crs:"EPSG:4326", ...extra
  });
  const r = d && d.response;
  if (!r) throw new Error("응답 없음");
  if (r.status === "NOT_FOUND") return [];
  if (r.status !== "OK") throw new Error((r.error && (r.error.text || r.error.code)) || r.status);
  return (r.result && r.result.featureCollection && r.result.featureCollection.features) || [];
}
async function vwFeaturesInBox(layer, bbox, maxPages){
  const all = [];
  for (let page = 1; page <= (maxPages || 4); page++){
    const fs = await vwData(layer, { geomFilter:`BOX(${bbox.join(",")})`, size:1000, page });
    all.push(...fs);
    if (fs.length < 1000) break;
  }
  return all;
}
function zoneText(p){ p = p || {}; return p.uname || p.dgm_nm || p.alias || Object.values(p).find(v => typeof v === "string" && /보호구역|정화구역/.test(v)) || ""; }
function zoneKind(p, geom){
  const t = Object.values(p || {}).join(" ");
  if (/절대/.test(t)) return "abs";
  if (/상대/.test(t)) return "rel";
  try { return turf.area(turf.feature(geom)) < 20000 ? "abs" : "rel"; } catch(e){ return "rel"; }   // 이름이 없으면 크기로 구분
}

async function vwSearch(q){
  const road = /(로|길)\s*\d/.test(q);
  const tries = [{ type:"address", category: road ? "road" : "parcel" }, { type:"address", category: road ? "parcel" : "road" }, { type:"place" }];
  for (const t of tries){
    try {
      const d = await jsonp("https://api.vworld.kr/req/search", {
        service:"search", request:"search", version:"2.0", crs:"EPSG:4326", size:8, page:1,
        query:q, format:"json", errorformat:"json", key:VW_KEY, ...t });
      const r = d && d.response;
      if (r && r.status === "OK" && r.result && r.result.items && r.result.items.length){
        return r.result.items.map(it => ({
          title: t.type === "place" ? it.title : (it.address && (it.address.parcel || it.address.road)) || it.title,
          sub: t.type === "place" ? ((it.address && (it.address.road || it.address.parcel)) || "") : ((it.address && it.address.road) || ""),
          x: Number(it.point.x), y: Number(it.point.y) }));
      }
    } catch(e){}
  }
  return [];
}

/* ===== 기하 계산 (미터) ===== */
function polysOf(g){ return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; }
function ringsOf(g){ return polysOf(g).flat(); }
function makeXY(ref){ const k = Math.cos(ref[1]*Math.PI/180)*111320; return c => [(c[0]-ref[0])*k, (c[1]-ref[1])*110574]; }
function segT(p, a, b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; return Math.max(0, Math.min(1, t)); }
function segDist(p, a, b){ const t = segT(p,a,b); return Math.hypot(p[0]-a[0]-t*(b[0]-a[0]), p[1]-a[1]-t*(b[1]-a[1])); }
// 가장 가까운 두 점 (치수선용)
function nearestPairG(A, B){
  const xy = makeXY(ringsOf(A)[0][0]);
  let best = { d:Infinity };
  const run = (P, Q, flip) => {
    for (const ra of ringsOf(P)) for (const v of ra){
      const p = xy(v);
      for (const rb of ringsOf(Q)) for (let i=0;i<rb.length-1;i++){
        const a = xy(rb[i]), b = xy(rb[i+1]), t = segT(p,a,b);
        const d = Math.hypot(p[0]-a[0]-t*(b[0]-a[0]), p[1]-a[1]-t*(b[1]-a[1]));
        if (d < best.d){ const q = [rb[i][0] + t*(rb[i+1][0]-rb[i][0]), rb[i][1] + t*(rb[i+1][1]-rb[i][1])]; best = flip ? { d, a:q, b:v } : { d, a:v, b:q }; }
      }
    }
  };
  run(A, B, false); run(B, A, true);
  return best;
}
function intersects(A, B){ try { return turf.booleanIntersects(turf.feature(A), turf.feature(B)); } catch(e){ return false; } }
function geomDist(A, B){ return intersects(A, B) ? 0 : nearestPairG(A, B).d; }
function setDist(As, Bs){ let m = Infinity; As.forEach(a => Bs.forEach(b => m = Math.min(m, geomDist(a,b)))); return m; }
function pointDist(pt, Gs){
  let m = Infinity;
  const xy = makeXY(pt), p = xy(pt);
  for (const g of Gs){
    try { if (turf.booleanPointInPolygon(turf.point(pt), turf.feature(g))) return 0; } catch(e){}
    for (const r of ringsOf(g)) for (let i=0;i<r.length-1;i++) m = Math.min(m, segDist(p, xy(r[i]), xy(r[i+1])));
  }
  return m;
}
function ptpt(a, b){ return turf.distance(turf.point(a), turf.point(b), { units:"meters" }); }
function shapeDist(A, B){
  if (A.polys.length && B.polys.length) return setDist(A.polys, B.polys);
  if (A.polys.length && B.pt) return pointDist(B.pt, A.polys);
  if (B.polys.length && A.pt) return pointDist(A.pt, B.polys);
  if (A.pt && B.pt) return ptpt(A.pt, B.pt);
  return null;
}
const schoolShape = s => ({ polys: s.parcels.map(p => p.geom), pt: s.parcels.length ? null : s.gate });
const facShape = f => ({ polys: f.parcels.map(p => p.geom), pt: f.parcels.length ? null : f.point });
const projShape = () => ({ polys: state.project.map(p => p.geom), pt: null });
const hasShape = sh => sh.polys.length || sh.pt;
function centroidOf(Gs){ return turf.centroid(turf.featureCollection(Gs.map(g => turf.feature(g)))).geometry.coordinates; }
function shapeCenter(sh){ return sh.polys.length ? centroidOf(sh.polys) : sh.pt; }
const DIRS = ["북","북동","동","남동","남","남서","서","북서"];
function dirName(from, to){ let b = turf.bearing(turf.point(from), turf.point(to)); b = (b+360)%360; return DIRS[Math.round(b/45)%8]; }
function areaOf(Gs){ return Gs.reduce((s,g) => s + turf.area(turf.feature(g)), 0); }
function routeLen(r){ let L = 0; for (let i=1;i<r.pts.length;i++) L += ptpt(r.pts[i-1], r.pts[i]); return L; }
function bufferOf(gs, m){
  try {
    const bs = gs.map(g => turf.buffer(turf.feature(g), m, { units:"meters" }));
    return bs.length > 1 ? turf.union(turf.featureCollection(bs)) : bs[0];
  } catch(e){ return null; }
}

/* ===== 보호구역 ===== */
const useOfficial = s => s.zsrc === "official" && s.official;
// 기존 학교: 출입문에서 50m / 신설(학교설립예정지): 학교경계에서 50m
function absZone(s){
  if (s.zsrc === "planned"){ const gs = s.parcels.map(p => p.geom); return gs.length ? bufferOf(gs, 50) : null; }
  return s.gate ? turf.circle(s.gate, 50, { units:"meters", steps:72 }) : null;
}
// 상대보호구역: 학교경계로부터 200m 중 절대보호구역 제외
function relZone(s){
  const gs = s.parcels.map(p => p.geom); if (!gs.length) return null;
  let buf = bufferOf(gs, 200), abs = absZone(s);
  if (buf && abs){ try { const d = turf.difference(turf.featureCollection([buf, abs])); if (d) buf = d; } catch(e){} }
  return buf;
}
async function loadOfficial(s){
  const gs = s.parcels.length ? s.parcels.map(p => p.geom) : (s.gate ? [turf.point(s.gate).geometry] : []);
  if (!gs.length){ toast("교지나 교문을 먼저 넣어 주세요"); return false; }
  const near = bufferOf(gs, 20), box = bufferOf(gs, 260);
  toast("고시 보호구역 불러오는 중…", 15000);
  let fs;
  try { fs = await vwFeaturesInBox("LT_C_UO101", turf.bbox(box), 2); }
  catch(e){ toast("불러오기 실패: " + e.message, 5000); return false; }
  fs = fs.filter(f => intersects(f.geometry, near.geometry));
  if (!fs.length){ toast("이 학교의 고시 보호구역 자료를 찾지 못했어요. 직접 계산으로 쓰세요", 4000); return false; }
  s.official = { abs:[], rel:[], names:[] };
  fs.forEach(f => { s.official[zoneKind(f.properties, f.geometry) === "abs" ? "abs" : "rel"].push(f.geometry); const n = zoneText(f.properties); if (n) s.official.names.push(n); });
  s.official.names = uniq(s.official.names);
  toast(`고시 보호구역을 불러왔어요 (절대 ${s.official.abs.length} · 상대 ${s.official.rel.length})`, 4000);
  return true;
}

function scorePark(d){ return d === 0 ? 5 : d <= 50 ? 4 : d <= 100 ? 3 : d <= 150 ? 2 : 1; }
function scoreCult(d){ return d === 0 ? 5 : d <= 50 ? 4 : d <= 200 ? 3 : d <= 400 ? 2 : 1; }
function scoreWalk(d, kind){
  if (kind === "초등학교") return d <= 400 ? 5 : d <= 800 ? 4 : d <= 1000 ? 3 : d <= 1500 ? 2 : 1;
  if (kind === "중학교" || kind === "고등학교") return d <= 800 ? 5 : d <= 1600 ? 4 : d <= 2400 ? 3 : d <= 3000 ? 2 : 1;
  return null;
}
const gradeTxt = sc => sc ? `${GRADE[sc]}(${sc})` : "-";

const needWalk = s => ["초등학교","중학교","고등학교"].includes(s.kind);

const findS = id => state.schools.find(x => x.id === id);
const findF = id => state.facs.find(x => x.id === id);
const findR = id => state.routes.find(x => x.id === id);
const findW = id => state.walks.find(x => x.id === id);
const findL = id => findR(id) || findW(id);
function nearestFac(s, type){
  const sh = schoolShape(s); if (!hasShape(sh)) return null;
  let best = null;
  state.facs.filter(f => f.type === type).forEach(f => {
    const fs = facShape(f); if (!hasShape(fs)) return;
    const d = shapeDist(sh, fs);
    if (d !== null && (!best || d < best.d)) best = { f, d };
  });
  return best;
}
function entranceDist(s){
  const sg = (s.sgates || []).filter(g => g.kind !== "차량출입구");
  const targets = [...(s.gate ? [{ pt:s.gate, nm:"교문" }] : []), ...sg.map(g => ({ pt:g.pt, nm:g.kind }))];
  const tShapes = targets.length ? targets.map(t => ({ sh:{ polys:[], pt:t.pt }, nm:t.nm })) : [{ sh:schoolShape(s), nm:"교지경계" }];
  const srcs = [...state.facs.filter(f => f.type === "gateA").map(f => ({ sh:facShape(f), f })), ...state.pgates.filter(isPedGate).map(g => ({ sh:{ polys:[], pt:g.pt }, f:{ name:g.kind, gate:g } }))];
  let best = null;
  tShapes.forEach(t => { if (!hasShape(t.sh)) return; srcs.forEach(x => { if (!hasShape(x.sh)) return; const d = shapeDist(t.sh, x.sh);
    if (d !== null && (!best || d < best.d)) best = { f:x.f, d, toGate: t.nm !== "교지경계", gateName:t.nm, tsh:t.sh, ssh:x.sh }; }); });
  return best;
}
function hazards(s){
  const sh = schoolShape(s); if (!hasShape(sh)) return null;
  return state.facs.filter(f => f.type === "haz").map(f => { const fs = facShape(f); return hasShape(fs) ? { f, d: shapeDist(sh, fs) } : null; }).filter(x => x && x.d <= 300);
}
function schoolRow(s, i){
  const sh = schoolShape(s), pj = projShape(), out = { s, i };
  if (pj.polys.length && hasShape(sh)){
    out.dB = s.parcels.length ? setDist(pj.polys, sh.polys) : null;
    out.dG = s.gate ? pointDist(s.gate, pj.polys) : null;
    out.dAny = out.dB !== null ? out.dB : out.dG;
    out.dir = dirName(shapeCenter(sh), centroidOf(pj.polys));
    if (s.zsrc === "planned") out.zone = out.dB === null ? "-" : out.dB <= 50 ? "절대보호구역" : out.dB <= 200 ? "상대보호구역" : "보호구역 외";
    else out.zone = (out.dG !== null && out.dG <= 50) ? "절대보호구역" : (out.dB !== null && out.dB <= 200) ? "상대보호구역" : "보호구역 외";
    if (useOfficial(s)){
      const hit = arr => arr.some(g => pj.polys.some(pp => intersects(g, pp)));
      out.zone = hit(s.official.abs) ? "절대보호구역" : hit(s.official.rel) ? "상대보호구역" : "보호구역 외";
      out.zoneSrc = "고시";
    }
  }
  out.park = nearestFac(s, "park");
  out.cult = nearestFac(s, "cult");
  out.ent = entranceDist(s);
  out.haz = hazards(s);
  const routes = state.routes.filter(r => r.schoolId === s.id && r.pts.length > 1);
  if (routes.length){
    const r = routes.reduce((a,b) => routeLen(a) >= routeLen(b) ? a : b);
    out.walk = { r, len: routeLen(r) };
    out.walk.min = Math.max(1, Math.round(out.walk.len / WALK_SPEED / 60));
    out.walk.sc = scoreWalk(out.walk.len, s.kind);
  }
  return out;
}

  let g = null;
  // 좌표를 1cm 단위로 맞춘 뒤 합치고, 그래도 틈이 남으면 아주 살짝 부풀려 합친 뒤 되돌림

  const rings = [], lines = [], pts = [];
  const addG = g => g && ringsOf(g).forEach(r => rings.push(r));
  addG(siteUnion()); state.project.forEach(p => addG(p.geom));
  state.schools.forEach(s => { s.parcels.forEach(p => addG(p.geom)); if (s.gate) pts.push(s.gate); (s.sgates || []).forEach(g => pts.push(g.pt)); });
  state.facs.forEach(f => { f.parcels.forEach(p => addG(p.geom)); if (f.point) pts.push(f.point); });
  nearFeats.forEach(f => addG(f.geom));
  state.pgates.forEach(g => pts.push(g.pt));
  const S = state.safety;
  [...state.routes, ...state.walks, ...S.lines].forEach(l => { if (l.pts.length > 1) lines.push(l.pts); l.pts.forEach(v => pts.push(v)); });
  S.areas.forEach(a => { if (a.pts.length > 2) rings.push([...a.pts, a.pts[0]]); a.pts.forEach(v => pts.push(v)); });
  S.pts.forEach(p => pts.push(p.pt)); S.posts.forEach(p => pts.push(p.pt)); S.cranes.forEach(c => pts.push(c.pt));
  return { rings, lines, pts };
}
// 화면에서 tol 픽셀 안의 꼭짓점 → 선 위 순서로 붙기
function snapPoint(lng, lat, tol = 12){
  if (!snapOn || !map) return null;
  const P0 = map.latLngToContainerPoint([lat, lng]);
  const q = map.containerPointToLatLng([P0.x + tol, P0.y + tol]), dLng = Math.abs(q.lng - lng), dLat = Math.abs(q.lat - lat);
  const near = b => !(lng < b[0]-dLng || lng > b[2]+dLng || lat < b[1]-dLat || lat > b[3]+dLat);
  const cp = v => map.latLngToContainerPoint([v[1], v[0]]);
  const { rings, lines, pts } = snapSources();
  const paths = [...rings, ...lines];
  let best = null;
  const tryV = v => { if (Math.abs(v[0]-lng) > dLng || Math.abs(v[1]-lat) > dLat) return; const c = cp(v), d = Math.hypot(c.x-P0.x, c.y-P0.y); if (d <= tol && (!best || d < best.d)) best = { d, pt:[v[0], v[1]], kind:"v" }; };
  pts.forEach(tryV);
  paths.forEach(r => { if (near(ringBox(r))) r.forEach(tryV); });
  if (best) return best;
  paths.forEach(r => { if (!near(ringBox(r))) return;
    for (let i = 0; i < r.length - 1; i++){
      const a = cp(r[i]), b = cp(r[i+1]), t = segT([P0.x, P0.y], [a.x, a.y], [b.x, b.y]);
      const x = a.x + t*(b.x-a.x), y = a.y + t*(b.y-a.y), d = Math.hypot(x-P0.x, y-P0.y);
      if (d <= tol && (!best || d < best.d)){ const L2 = map.containerPointToLatLng([x, y]); best = { d, pt:[L2.lng, L2.lat], kind:"e" }; }
    } });
  return best;
}
function lastDrawPt(){
  if (!mode) return null;
  const l = mode.type === "safeShape" ? findSL(mode.id) : (mode.type === "route" || mode.type === "walk") ? findL(mode.id) : null;
  return l && l.pts.length ? l.pts[l.pts.length - 1] : null;
}
function snapPreview(e){
  if (!snapLayer) return;
  snapLayer.clearLayers();
  if (!mode || !SNAP_MODES.includes(mode.type)) return;
  let pt = [e.latlng.lng, e.latlng.lat];
  const sn = (e.originalEvent && e.originalEvent.shiftKey) ? null : snapPoint(pt[0], pt[1]);
  if (sn) pt = sn.pt;
  const last = lastDrawPt();
  if (last) L.polyline([[last[1], last[0]], [pt[1], pt[0]]], { color:"#495057", weight:1.5, dashArray:"4 4", interactive:false, renderer:rOver }).addTo(snapLayer);
  if (sn) L.circleMarker([pt[1], pt[0]], { radius: sn.kind === "v" ? 7 : 5, color: sn.kind === "v" ? "#d6336c" : "#1c7ed6", weight:2, fill:true, fillColor:"#fff", fillOpacity:0.9, interactive:false, renderer:rOver }).addTo(snapLayer);
}

  }

    const g = { id:uid("g"), kind: mode.type === "pgate" ? "주출입구" : "학생출입구", pt:[lng, lat], rot:0 };

  }

  }

    const l = findSL(mode.id); if (l){ l.pts.push([lng, lat]); changed(); updateModeText(); } return;
  }

let roadBusy = false;

      const buf = turf.buffer(base, 40, { units:"meters" }), bb = turf.bbox(buf);

/* ===== 바탕지도 담기 =====
   1) 브이월드 타일을 직접 그려 보고 (서버가 허용하면 묻지 않고 바로 됨)
   2) 안 되면 브라우저 ‘이 탭 공유’로 화면을 찍어서 지도 틀만 잘라 씀 */
let tileCORS = null, capStream = null, capVideo = null;
const MAP_PANES = ["tilePane", "zone", "cad"];
const tileImgs = () => MAP_PANES.flatMap(p => map && map.getPane(p) ? [...map.getPane(p).querySelectorAll("img.leaflet-tile")] : []);
const tilesOn = () => !!map && ly.withBase !== false && tileImgs().length > 0;
function loadCors(src){ return new Promise(res => { const t = new Image(); t.crossOrigin = "anonymous"; const to = setTimeout(() => res(null), 6000); t.onload = () => { clearTimeout(to); res(t); }; t.onerror = () => { clearTimeout(to); res(null); }; t.src = src; }); }
async function testTileCORS(){
  const im = tileImgs().find(i => i.classList.contains("leaflet-tile-loaded")); if (!im) return;
  const t = await loadCors(im.src);
  if (!t){ tileCORS = false; return; }
  try { const c = document.createElement("canvas"); c.width = c.height = 2; const g = c.getContext("2d"); g.drawImage(t, 0, 0); g.getImageData(0, 0, 1, 1); tileCORS = true; } catch(e){ tileCORS = false; }
}
async function waitTiles(max = 7000){
  const t0 = Date.now(); await sleep(200);
  while (Date.now() - t0 < max){ if (!tileImgs().some(im => !im.complete)) break; await sleep(150); }
  await sleep(200);
}
async function drawTiles(g){
  const mr = $("#map").getBoundingClientRect(); let ok = 0, bad = 0;
  for (const pn of MAP_PANES){
    const pane = map.getPane(pn); if (!pane) continue;
    for (const lay of pane.querySelectorAll(".leaflet-layer")){
      if (lay.style.display === "none") continue;
      const op = parseFloat(lay.style.opacity || "1");
      const ims = [...lay.querySelectorAll("img.leaflet-tile-loaded")];
      const got = await Promise.all(ims.map(im => loadCors(im.src)));
      ims.forEach((im, i) => { const t = got[i]; if (!t){ bad++; return; } ok++; const r = im.getBoundingClientRect(); g.globalAlpha = op; g.drawImage(t, r.left - mr.left, r.top - mr.top, r.width, r.height); });
    }
  }
  g.globalAlpha = 1;
  try { g.getImageData(0, 0, 1, 1); } catch(e){ return { ok:0, bad:1 }; }
  return { ok, bad };
}
function drawMask(g){
  const su = siteUnion(); if (!su || ly.siteMask === false || !dispNow().project) return;
  g.beginPath();
  polysOf(su).forEach(poly => poly.forEach(r => r.forEach((c, i) => { const p = map.latLngToContainerPoint([c[1], c[0]]); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); })));

}
async function startCapture(){
  if (capVideo) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return false;
  try { capStream = await navigator.mediaDevices.getDisplayMedia({ video:{ displaySurface:"browser", frameRate:15 }, audio:false, preferCurrentTab:true, selfBrowserSurface:"include", surfaceSwitching:"exclude" }); }
  catch(e){ capStream = null; return false; }

  try { await v.play(); } catch(e){}
  capVideo = v; capStream.getVideoTracks()[0].addEventListener("ended", stopCapture);
  await sleep(300); return true;
}
function stopCapture(){ if (capStream) capStream.getTracks().forEach(t => t.stop()); capStream = null; capVideo = null; }
function freshFrame(){ return new Promise(res => { const v = capVideo; let n = 0; const done = () => setTimeout(res, 60); if (v && v.requestVideoFrameCallback){ const f = () => { if (++n >= 3) done(); else v.requestVideoFrameCallback(f); }; v.requestVideoFrameCallback(f); setTimeout(res, 1500); } else setTimeout(res, 600); }); }
function grabFrame(){
  const v = capVideo; if (!v || !v.videoWidth) return null;
  const mr = $("#map").getBoundingClientRect(), sx = v.videoWidth / window.innerWidth, sy = v.videoHeight / window.innerHeight;
  if (Math.abs(sx - sy) / sx > 0.05){ toast("‘이 탭’을 골라 공유해 주세요 (다른 창·화면은 잘라낼 수 없어요)", 5000); return null; }
  const c = document.createElement("canvas"); c.width = Math.round(mr.width * sx); c.height = Math.round(mr.height * sy);
  c.getContext("2d").drawImage(v, mr.left * sx, mr.top * sy, mr.width * sx, mr.height * sy, 0, 0, c.width, c.height);

function loadSvgImg(svg){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
// 지도 틀 크기의 바탕 그림 (바탕지도 + 레이어 + 붙인 도면). 그린 선·글씨는 안 들어감
async function bgCanvas(k){
  const sz = map.getSize(), W = sz.x, H = sz.y;
  const c = document.createElement("canvas"); c.width = Math.round(W * k); c.height = Math.round(H * k);
  const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.scale(k, k); g.imageSmoothingQuality = "high";
  const tiles = tilesOn();
  if (tiles) await waitTiles();
  if (tiles && capVideo){
    document.body.classList.add("bgshot"); await freshFrame(); const f = grabFrame(); document.body.classList.remove("bgshot");
    if (f){ g.drawImage(f, 0, 0, W, H); return { c, g, how:"cap", missed:false }; }
  }
  let how = "none";
  if (tiles){ const r = await drawTiles(g); if (r.ok) how = "tiles"; else if (r.bad) tileCORS = false; }
  drawMask(g);

  if (Object.keys(ov).length){ try { g.drawImage(await loadSvgImg(buildSVG(ov, { only:"overlay" }).svg), 0, 0, W, H); } catch(e){} }
  return { c, g, how, missed: tiles && how === "none" };
}

  { id:"noto",   name:"본고딕 (Noto Sans)", fam:'"Noto Sans KR",sans-serif', css:GF("Noto+Sans+KR:wght@400;600;700") },
  { id:"nanum",  name:"나눔고딕",          fam:'"Nanum Gothic",sans-serif', css:GF("Nanum+Gothic:wght@400;700;800") },
  { id:"ibm",    name:"IBM 플렉스 산스",    fam:'"IBM Plex Sans KR",sans-serif', css:GF("IBM+Plex+Sans+KR:wght@400;600;700") },
  { id:"gowun",  name:"고운돋움",          fam:'"Gowun Dodum",sans-serif', css:GF("Gowun+Dodum") },
  { id:"myeong", name:"나눔명조",          fam:'"Nanum Myeongjo",serif', css:GF("Nanum+Myeongjo:wght@400;700;800") }
];
let ui = { font:"sys", size:15, lbl:12, ...(ls("eduMap.ui") || {}) };
let localFonts = ls("eduMap.localFonts") || [];
function fontOptions(){
  const opts = FONTS.map(f => `<option value="${f.id}">${f.name}</option>`);
  if (ui.font.startsWith("local:") && !localFonts.includes(ui.font.slice(6))) localFonts = [ui.font.slice(6), ...localFonts];
  if (localFonts.length) opts.push(`<optgroup label="내 컴퓨터 글씨체 (${localFonts.length})">${localFonts.map(n => `<option value="local:${esc(n)}">${esc(n)}</option>`).join("")}</optgroup>`);
  $("#fontSel").innerHTML = opts.join(""); $("#fontSel").value = ui.font;
}
async function loadLocalFonts(){
  if (!window.queryLocalFonts){ toast("이 브라우저는 글씨체 목록을 못 가져와요. 크롬·엣지에서 쓰거나, 아래 칸에 글씨체 이름을 직접 써 주세요", 6000); return; }
  try {
    const fonts = await window.queryLocalFonts();
    localFonts = uniq(fonts.map(f => f.family)).sort((a, b) => { const ka = /[가-힣]/.test(a), kb = /[가-힣]/.test(b); return ka !== kb ? (ka ? -1 : 1) : a.localeCompare(b, "ko"); });
    ls("eduMap.localFonts", localFonts); fontOptions(); toast(`내 컴퓨터 글씨체 ${localFonts.length}개를 불러왔어요`);
  } catch(e){ toast("글씨체 접근을 허용해야 불러올 수 있어요", 4000); }
}
function applyUI(){
  const f = ui.font.startsWith("local:") ? { id:ui.font, fam:`"${ui.font.slice(6)}",-apple-system,"Malgun Gothic",sans-serif` } : (FONTS.find(x => x.id === ui.font) || FONTS[0]);
  if (f.css && !document.querySelector(`link[data-font="${f.id}"]`)){ const l = document.createElement("link"); l.rel = "stylesheet"; l.href = f.css; l.dataset.font = f.id; document.head.appendChild(l); }
  document.documentElement.style.setProperty("--font", f.fam);
  document.documentElement.style.setProperty("--lblfs", ui.lbl + "px");
  $("#panel").style.zoom = ui.size / 15;
  ls("eduMap.ui", ui);
}
fontOptions();
$("#btnLocalFonts").onclick = loadLocalFonts;
$("#fontNameBtn").onclick = () => { const n = $("#fontName").value.trim(); if (!n) return; ui.font = "local:" + n; if (!localFonts.includes(n)){ localFonts = [n, ...localFonts]; ls("eduMap.localFonts", localFonts); } fontOptions(); applyUI(); toast(`‘${n}’ 글씨체로 바꿨어요 (컴퓨터에 없으면 기본 글씨로 보여요)`, 4000); };
$("#fontSel").value = ui.font; $("#sizeSel").value = String(ui.size); $("#lblSel").value = String(ui.lbl);
$("#fontSel").onchange = e => { ui.font = e.target.value; applyUI(); };
$("#sizeSel").onchange = e => { ui.size = Number(e.target.value); applyUI(); };
$("#lblSel").onchange = e => { ui.lbl = Number(e.target.value); applyUI(); };
$("#setBtn").onclick = () => { const p = $("#pop"); p.style.display = p.style.display === "flex" ? "none" : "flex"; };
document.addEventListener("mousedown", e => { const p = $("#pop"); if (p.style.display === "flex" && !p.contains(e.target) && e.target.id !== "setBtn") p.style.display = "none"; });
applyUI();

/* ===== 시작 ===== */
initMap();
renderSnapBtns();
loadOverlayImages();
layoutFrame(); redraw(); renderPanel(); hints();
</script>
</body>
</html>
