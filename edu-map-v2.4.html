<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육환경 위치도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --sub:#5b6470; --line:#e3e6ea; --soft:#f6f7f9; --blue:#2f6fdf; --blueSoft:#eef3fc; --blueInk:#2459c4;
  --proj:#e5484d; --gate:#f08c00; --ok:#1a7f37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif);font-size:15px}
button,input,select,textarea{font-family:inherit}
/* 틀 */
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:relative}
#topbar .brand{font-weight:700;font-size:16px;white-space:nowrap}
#topbar .pname{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#saved{font-size:12px;color:var(--ok);background:#eaf6ec;padding:2px 8px;border-radius:10px;white-space:nowrap}
#main{flex:1;display:flex;min-height:0}
#rail{width:232px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px;padding:8px 8px 24px;background:#fbfcfd;overflow:auto}
#rail.mini{width:58px}
.tocMini{border:none;background:transparent;color:var(--sub);font-size:12px;text-align:left;padding:4px 8px;cursor:pointer;border-radius:6px}
.tocMini:hover{background:#eef0f3}
.tocg{font-size:11.5px;color:var(--sub);font-weight:700;margin:12px 8px 3px;letter-spacing:.02em}
.toc{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border:none;background:transparent;border-radius:8px;text-align:left;cursor:pointer;color:var(--ink);font-size:13px;line-height:1.3;width:100%}
.toc:hover{background:#eef0f3}
.toc.cur{background:var(--blueSoft);color:var(--blueInk);font-weight:600}
.toc .sd,.dash .sd{width:18px;height:18px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.sd.na{background:#eef0f3;color:#8a939e}
.toc small,.dn small{display:block;font-size:11px;color:var(--sub);font-weight:400}
#rail.mini .tn,#rail.mini .tocg{display:none}
#rail.mini .toc{justify-content:center}
.nhead h2{margin:2px 0 0;font-size:19px;line-height:1.3}
.nhead .crumb{font-size:12px;color:var(--sub)}
.ntabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #d6dae0;border-radius:10px;overflow:hidden;margin-top:10px}
.ntabs button{height:38px;border:none;border-left:1px solid #d6dae0;background:#fff;font-size:14px;cursor:pointer;color:var(--ink)}
.ntabs button:first-child{border-left:none}
.ntabs button.on{background:var(--ink);color:#fff;font-weight:600}
.nfoot{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.nfoot .btn{max-width:49%;overflow:hidden;text-overflow:ellipsis}
#panel.wide{width:540px}
.dash{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--line)}
.dash .dn{flex:1;min-width:0;border:none;background:none;text-align:left;font-size:13.5px;cursor:pointer;color:var(--ink);padding:0}
.dash .dn:hover{color:var(--blueInk)}
.dash .dv{font-size:12px;color:var(--sub);white-space:pre-line;text-align:right;max-width:150px}
.dash .dbt{display:flex;gap:4px;flex:none}
.dash .dbt .btn{height:30px;padding:0 9px;font-size:12.5px}
.fcard{display:flex;flex-direction:column;gap:2px}
.fcard .ft{font-size:14px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;font-size:14px}
.drow label,.drow>span{display:flex;align-items:center;gap:8px;cursor:pointer}
.rstep{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;border:none;background:transparent;color:#4a5260;cursor:pointer}
.rstep .dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#e9ecef;color:#4a5260}
.rstep .nm{font-size:12px;font-weight:500}
.rstep.cur{background:var(--blueSoft);color:var(--blueInk)}
.rstep.cur .dot{background:var(--blue);color:#fff}
.rstep.done .dot{background:#d7ecdc;color:var(--ok)}
#mapWrap{flex:1;position:relative;min-width:0;background:#eef0f3}
#frame{position:absolute;inset:0}
#frame.print{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(0,0,0,.14);background:#fff}
#map{position:absolute;inset:0;background:#f2f3f5}
.leaflet-container{font-family:inherit}
#panel{width:430px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1000px){
  #main{flex-direction:column}
  #rail,#rail.mini{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);padding:6px;overflow-x:auto}
  .tocg,.tocMini,.toc small{display:none}
  .toc{width:auto;flex:none;white-space:nowrap}
  #panel.wide{width:auto}
  .rstep{flex:1;min-width:64px;padding:6px 4px}
  #mapWrap{flex:none;height:55vh}
  #panel{width:auto;border-left:none;border-top:1px solid var(--line);flex:1}
}
/* 공통 컨트롤 */
.btn{height:40px;padding:0 14px;border-radius:9px;border:1px solid #d6dae0;background:#fff;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f7f9}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:#2a62c8}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{height:34px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.on{background:var(--blueSoft);border-color:var(--blue);color:var(--blueInk)}
.btn.full{width:100%}
.btn.dashed{border-style:dashed;border-color:#b9c3d3;background:#f7f9fc;color:var(--blueInk)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid #d6dae0;border-radius:9px;overflow:hidden}
.seg button{height:36px;border:none;border-left:1px solid #d6dae0;background:#fff;font-size:13px;color:var(--ink);cursor:pointer;padding:0 4px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--blue);color:#fff}
.inp{height:38px;border:1px solid #d6dae0;border-radius:8px;padding:0 10px;font-size:14px;width:100%;background:#fff}
.inp.sm{height:32px;font-size:13.5px;padding:0 8px}
select.inp{padding:0 6px}
.lab{font-size:13px;color:#4a5260;margin-bottom:4px;display:block}
.muted{color:var(--sub);font-size:13px;line-height:1.55}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.card.hl{border-color:#c9d8f5;background:#fbfcff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parcel{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.parcel:last-child{border-bottom:none}
.parcel .t{flex:1;line-height:1.45;min-width:0}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:#4a5260;white-space:nowrap}
.badge.abs{background:#fff1e0;color:#9a5b00}
.badge.rel{background:var(--blueSoft);color:var(--blueInk)}
.badge.out{background:#eaf6ec;color:var(--ok)}
.badge.bad{background:#fdecec;color:#c42b2b}
.stepHead .no{font-size:12.5px;color:var(--sub)}
.stepHead h2{margin:2px 0 0;font-size:20px}
.sumbox{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:76px minmax(0,1fr);row-gap:6px;font-size:14px}
.sumbox .k{color:var(--sub)}
.next{margin-top:auto}
.prog{height:6px;background:#e9ecef;border-radius:3px}
.prog i{display:block;height:6px;background:var(--blue);border-radius:3px}
.item{border:1px solid var(--line);border-radius:12px;background:#fff}
.item.open{border-color:#c9d8f5;background:#fbfcff}
.ihead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:none;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.ihead .sd{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sd.ok{background:#d7ecdc;color:var(--ok)}
.sd.todo{background:#fff1e0;color:#9a5b00}
.ihead .tt{flex:1;min-width:0}
.ihead .tt b{font-size:14px;font-weight:600;display:block}
.ihead .tt span{font-size:12px;color:var(--sub)}
.ihead .vv{font-size:12.5px;text-align:right;white-space:pre-line;color:var(--ink)}
.ibody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.res{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px;line-height:1.5}
.res .s{font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 12px;border-radius:8px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:600}
td.l{text-align:left}
td[contenteditable]{background:#fffdf3;outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.sent{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.stg{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12.5px}
.stg input[type=color]{width:100%;height:30px;border:1px solid #d6dae0;border-radius:6px;padding:2px;background:#fff}
.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.palb{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid #d6dae0;border-radius:8px;background:#fff;font-size:12.5px;cursor:pointer;text-align:left;color:var(--ink)}
.palb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palb.on{border-color:var(--blue);background:var(--blueSoft)}
.postBox{transform:translate(-50%,-50%);background:#fff;border:1.5px solid #495057;border-radius:6px;padding:3px 5px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:move}
.postBox .pi{display:flex;gap:2px}
.postBox .pn{font-size:var(--lblfs,12px);font-weight:700;color:#fff;background:#2f9e44;border-radius:3px;padding:0 5px;white-space:nowrap}
.ovWrap{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ovImg{position:absolute;transform-origin:50% 50%;max-width:none;pointer-events:none;user-select:none}
.roadg{display:grid;grid-template-columns:34px minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:12.5px}
.roadg .h{color:var(--sub);text-align:center}
/* 지도 위 */
.top{position:absolute;left:12px;right:12px;top:12px;z-index:1000}
.searchRow{display:flex;gap:6px}
.searchRow input{flex:1;min-width:0;height:42px;border:1px solid #d6dae0;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:520px}
.results div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.results div:hover{background:var(--soft)}
.results small{color:var(--sub)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chipRange{display:inline-flex;align-items:center;gap:6px;cursor:default}
.chipRange input{width:80px;accent-color:#1c7ed6}
.chipRange span{min-width:34px;font-variant-numeric:tabular-nums;color:#5c636a}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid #d6dae0;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#frame.print ~ .top, #mapWrap.printing .top{display:none}
body.bgshot #map .leaflet-overlay-pane, body.bgshot #map .leaflet-marker-pane, body.bgshot #map .leaflet-near-pane, body.bgshot #map .leaflet-tooltip-pane, body.bgshot #map .leaflet-popup-pane, body.bgshot #map .leaflet-control-container, body.bgshot #pTitle, body.bgshot #pNorth, body.bgshot #pLegend, body.bgshot #pScale, body.bgshot #toast, body.bgshot #mapMsg{visibility:hidden !important}
#modeBar{position:absolute;left:12px;bottom:14px;z-index:1000;display:none;align-items:center;gap:8px;max-width:calc(100% - 24px);
  background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.selL{outline:2px dashed #e03131;outline-offset:2px;background:rgba(224,49,49,.1)}
#selBox{position:absolute;border:1.5px dashed #e03131;background:rgba(224,49,49,.08);z-index:1200;pointer-events:none;display:none}
#modeBar span{font-size:14px;line-height:1.35}
#modeBar button{background:#fff;color:var(--ink);border:none;border-radius:8px;height:32px;padding:0 12px;font-size:13.5px;cursor:pointer}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:3000;display:none;max-width:90vw}
#zoneHint{position:absolute;left:12px;bottom:40px;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub);display:none}
#mapMsg{position:absolute;left:12px;right:12px;bottom:34px;z-index:1200;display:none;background:#fff9db;border:1px solid #ffe066;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 1px 6px rgba(0,0,0,.08)}
#legend,#pLegend{position:absolute;right:12px;bottom:46px;z-index:900;background:rgba(255,255,255,.96);border:1px solid #c9ced6;border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.85;display:none}
#pLegend{border-radius:0;bottom:12px;right:12px;background:none!important;border:none!important;padding:0!important;line-height:normal}
#legend i,#pLegend i{display:inline-block;width:18px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px}
#pTitle{font-size:var(--titlefs,14px)!important;position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:900;background:#fff;border:1px solid #c9ced6;padding:6px 12px;font-size:14px;font-weight:700;display:none}
#pNorth{position:absolute;left:8px;top:6px;z-index:900;display:none}
#pScale{position:absolute;z-index:900;display:none;pointer-events:none}
#frame.print .leaflet-control-scale{display:none}
#frame.print .leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:44px}
#frame.print .leaflet-control-attribution{opacity:.55;font-size:9px}
.tocsup{font-size:11px;color:#1c7ed6;font-weight:800;margin:14px 8px 0;letter-spacing:.06em;border-top:1px solid var(--line);padding-top:8px}
#rail.mini .tocsup{display:none}
.qsBtn{min-width:220px;justify-content:flex-start;color:var(--sub);gap:8px}
.qsBtn kbd,.qsk{font:11px/1 inherit;border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:#f8f9fa;color:var(--sub);margin-left:auto}
#dlg.wide{width:min(860px,94vw);max-width:none}
.qsIn{width:100%;height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:0 14px}
.qsList{max-height:56vh;overflow:auto;margin-top:8px}
.qsRow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:14px}
.qsRow.on,.qsRow:hover{background:#e7f5ff}
.qsRow .w{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
.fmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px;max-height:66vh;overflow:auto}
.fmap .g{border:1px solid var(--line);border-radius:10px;padding:10px}
.fmap .g b{display:block;font-size:13px;margin-bottom:6px}
.fmap .g button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.fmap .g button:hover{background:#e7f5ff}
.secchips{position:sticky;top:-1px;z-index:5;background:var(--bg,#fff);display:flex;flex-wrap:wrap;gap:4px;padding:6px 0 8px;margin:0 0 4px;border-bottom:1px solid var(--line)}
.secchips button{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;cursor:pointer}
.secchips button:hover{border-color:#1c7ed6;color:#1c7ed6}
.flash{animation:flashK 1.8s ease-out}
@keyframes flashK{0%,40%{box-shadow:0 0 0 3px #ffd43b;background:#fff9db}100%{box-shadow:0 0 0 0 transparent}}
.dropzone{border:2px dashed #adb5bd;border-radius:10px;padding:14px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;background:#fafbfc}
.dropzone:hover{border-color:#1c7ed6;color:#1c7ed6}
body.dropping::after{content:"여기에 놓으면 자료 종류를 알아서 넣어요";position:fixed;inset:12px;border:3px dashed #1c7ed6;border-radius:16px;background:rgba(231,245,255,.82);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#1864ab;z-index:99999;pointer-events:none}
.wzSteps{display:flex;gap:6px;margin:10px 0 12px}
.wzSteps span{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:8px;background:#f1f3f5;color:var(--sub)}
.wzSteps span.on{background:#1c7ed6;color:#fff;font-weight:700}
.wzSteps span.ok{background:#d3f9d8;color:#2b8a3e}
.librow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.librow .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.setbox{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:8px;background:#fafbfc}
details.setbox>summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600}
.tocfold{display:block;width:calc(100% - 8px);text-align:left;background:none;border:0;cursor:pointer;font-family:inherit}
.tocfold:hover{color:#1c7ed6}
.sumT td.up{color:#1c7ed6;font-weight:700}.sumT td.dn{color:#e03131;font-weight:700}
[contenteditable="true"]:focus{outline:2px solid #74c0fc;background:#f4faff}
body.ovFocus #map{background:#ffffff}
.schWrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
#layerPanel{position:absolute;right:12px;top:104px;z-index:1001;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 170px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
#layerPanel h4{margin:12px 0 4px;font-size:12px;color:var(--sub)}
#layerPanel label{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.lgsw{width:12px;height:12px;border-radius:2px;flex:none}
.nearLbl{transform:translate(-50%,-50%);font-size:calc(var(--lblfs,12px) - 2px);color:#222;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff}
.zlo .nearLbl{display:none}
.dimN{transform:translate(-50%,-50%);font-size:var(--lblfs,12px);font-weight:700;white-space:nowrap;display:inline-block;text-shadow:var(--neon)}

<script>
/* ===== 설정 ===== */
const APP_VERSION = "7.7";
const VW_KEY = "1C3C3956-A882-416D-8DE7-3A232A4B096B";

const KINDS = ["유치원","초등학교","중학교","고등학교","특수학교","기타"];
const WALK_SPEED = 0.7;                    // m/s (평가서 기준)
const FAC_TYPES = {
  park:  { name:"공원·녹지",            color:"#2e9e4f" },
  cult:  { name:"도서관·문화·체육시설",  color:"#8e44ad" },
  gateA: { name:"단지 출입구",          color:"#c2255c" },
  cons:  { name:"공사차량 출입구",       color:"#8d5a2b" },
  haz:   { name:"위험·유해시설",         color:"#212529" },
  etc:   { name:"기타",                 color:"#495057" }
};
const GRADE = ["", "매우미흡", "미흡", "보통", "우수", "매우우수"];
const STEPS = ["사업지", "대상학교", "위치항목", "위치도", "결과"];
const ROAD_FN = ["", "주간선", "보조간선", "집산", "국지"];
const DIR4 = [["E","동측"],["W","서측"],["S","남측"],["N","북측"]];

/* ===== 공통 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ko-KR");
// 이격거리 글자: 연접(맞닿음)은 0.0m
const dTx = (d, dec) => d === null || d === undefined || isNaN(d) ? "-" : d < 0.05 ? "0.0m" : `약 ${dec ? m1(d) : fmt(d)}m`;
const m1 = n => (Math.round(n*10)/10).toLocaleString("ko-KR", { minimumFractionDigits:1, maximumFractionDigits:1 });
const uid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e4);
let toastT;
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none", ms); }
function josa(word, a, b){ const c = String(word).trim().slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return a+"("+b+")"; return (c-0xAC00)%28 ? b : a; }
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function uniq(a){ return [...new Set(a.filter(Boolean))]; }

/* ===== 사업(프로젝트) 저장 ===== */
const PKEY = "eduMap.projects";
function blankState(name){
  return { name: name || "새 사업", project:[], schools:[], facs:[], routes:[], walks:[],
    roadFn:null, manual:{ traffic:{}, roads:{}, link:{}, walk2:{ closed:"없음", roofW:2.0, detour:"해당사항 없음" }, times:{} }, sections:[], after:{}, safety:{ posts:[], pts:[], lines:[], areas:[], cranes:[], phases:null, cur:"all", autoEnt:true }, overlays:[], pgates:[],
    marks:[], pois:[], szones:[], rnames:null, bnames:null, roadLines:null, photos:[], lastBackup:0,
    print:{ preset:"loc", paper:"land", title:"<사업지 및 대상학교 위치도>", disp:null, leg:{ style:"tab", mode:"col" }, pbox:{ on:false, text:"", period:"" } } };
}
function normalize(s){
  const b = blankState();
  s = { ...b, ...(s || {}) };
  ["project","schools","facs","routes","walks"].forEach(k => s[k] = s[k] || []);
  s.manual = { ...b.manual, ...(s.manual || {}) };
  ["traffic","roads","link","times"].forEach(k => s.manual[k] = s.manual[k] || {});
  s.manual.walk2 = { ...b.manual.walk2, ...(s.manual.walk2 || {}) };
  s.sections = s.sections || [];
  ["marks","pois","szones","photos"].forEach(k => s[k] = s[k] || []);
  s.manual.transit = s.manual.transit || {};
  s.after = s.after || {};
  s.safety = { posts:[], pts:[], lines:[], areas:[], cranes:[], cur:"all", autoEnt:true, ...(s.safety || {}) };
  if (!s.safety.phases) s.safety.phases = [];
  v73Norm(s);   // v7.3: 공정 하나로 시작 · 복사해서 늘리기
  s.overlays = s.overlays || []; s.pgates = s.pgates || [];
  s.auto = s.auto || {}; s.auto.kz = s.auto.kz || []; s.auto.ped = s.auto.ped || []; s.auto.bike = s.auto.bike || []; s.auto.osmFoot = s.auto.osmFoot || []; s.auto.osmBike = s.auto.osmBike || [];
  s.schools.forEach(sc => sc.sgates = sc.sgates || []);
  s.print = { ...b.print, ...(s.print || {}) };
  s.schools.forEach(sc => {
    if (sc.short === undefined) sc.short = "";
    if (!sc.zsrc) sc.zsrc = sc.planned ? "planned" : "calc";
    if (sc.zsrc === "official" && !sc.official) sc.zsrc = "calc";
    delete sc.planned;
  });
  return s;
}
let reg = ls(PKEY) || { list:[], cur:null };
let state;
(function boot(){
  if (!reg.list.length){
    const old = ls("eduMap.v1");               // 예전 버전 자료 옮기기
    const id = uid("p");
    const st = normalize(old && old.project ? { ...old, name: old.name || "첫 사업" } : blankState("첫 사업"));
    reg = { list:[{ id, name: st.name, updated: Date.now() }], cur:id };
    ls("eduMap.p." + id, st); ls(PKEY, reg);
  }
  if (!reg.list.find(p => p.id === reg.cur)) reg.cur = reg.list[0].id;
  state = normalize(ls("eduMap.p." + reg.cur));
})();
let saveT;
let hist = [], hidx = -1, histLock = false, histT;
function pushHist(now){
  if (histLock) return; clearTimeout(histT);
  const go = () => { const sj = JSON.stringify(state); if (hist[hidx] === sj) return; hist = hist.slice(0, hidx + 1); hist.push(sj); if (hist.length > 60) hist.shift(); hidx = hist.length - 1; updUndo(); };
  if (now) go(); else histT = setTimeout(go, 350);
}
function updUndo(){ const u = document.getElementById("btnUndo"), r = document.getElementById("btnRedo"); if (u) u.disabled = hidx <= 0; if (r) r.disabled = hidx >= hist.length - 1; }
function histGo(d){
  clearTimeout(histT); const sj = JSON.stringify(state); if (hist[hidx] !== sj){ hist = hist.slice(0, hidx + 1); hist.push(sj); hidx = hist.length - 1; }
  const ni = hidx + d; if (ni < 0 || ni >= hist.length){ toast(d < 0 ? "더 되돌릴 게 없어요" : "다시 할 게 없어요"); return; }
  hidx = ni; histLock = true; state = normalize(JSON.parse(hist[hidx])); if (typeof _uCache !== "undefined") _uCache.clear();
  if (mode){ mode = null; $("#modeBar").style.display = "none"; }
  save(); redraw(); renderPanel(); histLock = false; updUndo(); toast(d < 0 ? "되돌렸어요" : "다시 했어요", 1200);
}
function save(){
  pushHist();
  ls("eduMap.p." + reg.cur, state);
  const it = reg.list.find(p => p.id === reg.cur);
  if (it){ it.name = state.name; it.updated = Date.now(); }
  ls(PKEY, reg);
  const sv = $("#saved"); sv.textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
  clearTimeout(saveT); saveT = setTimeout(() => sv.textContent = "자동 저장됨", 2500);
}
const showOf = s => (s.show = s.show || { site:true, abs:true, rel:true });

/* ===== 브이월드 (JSONP) ===== */
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cb = "vwcb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); reject(new Error("응답 시간 초과")); }, 12000);
    window[cb] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("불러오기 실패")); };
    sc.src = url + "?" + qs;
    document.head.appendChild(sc);
  });
}
async function vwData(layer, extra){
  const d = await jsonp("https://api.vworld.kr/req/data", {
    service:"data", version:"2.0", request:"GetFeature", data:layer, key:VW_KEY, domain:DOMAIN,
    format:"json", errorformat:"json", size:10, page:1, geometry:"true", attribute:"true", crs:"EPSG:4326", ...extra
  });
  const r = d && d.response;
  if (!r) throw new Error("응답 없음");
  if (r.status === "NOT_FOUND") return [];
  if (r.status !== "OK") throw new Error((r.error && (r.error.text || r.error.code)) || r.status);
  return (r.result && r.result.featureCollection && r.result.featureCollection.features) || [];
}
async function vwFeaturesInBox(layer, bbox, maxPages){
  const all = [];
  for (let page = 1; page <= (maxPages || 4); page++){
    const fs = await vwData(layer, { geomFilter:`BOX(${bbox.join(",")})`, size:1000, page });
    all.push(...fs);
    if (fs.length < 1000) break;
  }
  return all;
}
function zoneText(p){ p = p || {}; return p.uname || p.dgm_nm || p.alias || Object.values(p).find(v => typeof v === "string" && /보호구역|정화구역/.test(v)) || ""; }
function zoneKind(p, geom){
  const t = Object.values(p || {}).join(" ");
  if (/절대/.test(t)) return "abs";
  if (/상대/.test(t)) return "rel";
  try { return turf.area(turf.feature(geom)) < 20000 ? "abs" : "rel"; } catch(e){ return "rel"; }   // 이름이 없으면 크기로 구분
}
async function eduZoneAt(lng, lat){
  try {
    const fs = await vwData("LT_C_UO101", { geomFilter:`POINT(${lng} ${lat})`, geometry:"false" });
    return uniq(fs.map(f => zoneText(f.properties))).join(", ");
  } catch(e){ return ""; }
}
async function zoneAt(lng, lat){
  const layers = ["LT_C_UQ111","LT_C_UQ112","LT_C_UQ113","LT_C_UQ114"];
  const out = await Promise.all(layers.map(l => vwData(l, { geomFilter:`POINT(${lng} ${lat})`, geometry:"false" }).catch(() => [])));
  return uniq(out.flat().map(f => f.properties && (f.properties.uname || f.properties.UNAME))).join(", ");
}
async function parcelAt(lng, lat){
  const fs = await vwData("LP_PA_CBND_BUBUN", { geomFilter:`POINT(${lng} ${lat})` });
  if (!fs.length) return null;
  const f = fs[0], p = f.properties || {};
  const jibun = p.jibun || "";
  const parcel = { pnu:p.pnu, addr:p.addr || "", jibun, jimok:(jibun.match(/[가-힣]+$/) || [""])[0],
    jiga: p.jiga ? Number(p.jiga) : null, year: p.gosi_year || "", geom: f.geometry, zone:"" };
  try { const pt = turf.pointOnFeature(turf.feature(f.geometry)).geometry.coordinates; parcel.zone = await zoneAt(pt[0], pt[1]); } catch(e){}
  return parcel;
}
async function vwSearch(q){
  const road = /(로|길)\s*\d/.test(q);
  const tries = [{ type:"address", category: road ? "road" : "parcel" }, { type:"address", category: road ? "parcel" : "road" }, { type:"place" }];
  for (const t of tries){
    try {
      const d = await jsonp("https://api.vworld.kr/req/search", {
        service:"search", request:"search", version:"2.0", crs:"EPSG:4326", size:8, page:1,
        query:q, format:"json", errorformat:"json", key:VW_KEY, ...t });
      const r = d && d.response;
      if (r && r.status === "OK" && r.result && r.result.items && r.result.items.length){
        return r.result.items.map(it => ({
          title: t.type === "place" ? it.title : (it.address && (it.address.parcel || it.address.road)) || it.title,
          sub: t.type === "place" ? ((it.address && (it.address.road || it.address.parcel)) || "") : ((it.address && it.address.road) || ""),
          x: Number(it.point.x), y: Number(it.point.y) }));
      }
    } catch(e){}
  }
  return [];
}

/* ===== 기하 계산 (미터) ===== */
function polysOf(g){ return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; }
function ringsOf(g){ return polysOf(g).flat(); }
function makeXY(ref){ const k = Math.cos(ref[1]*Math.PI/180)*111320; return c => [(c[0]-ref[0])*k, (c[1]-ref[1])*110574]; }
function segT(p, a, b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; return Math.max(0, Math.min(1, t)); }
function segDist(p, a, b){ const t = segT(p,a,b); return Math.hypot(p[0]-a[0]-t*(b[0]-a[0]), p[1]-a[1]-t*(b[1]-a[1])); }
// 가장 가까운 두 점 (치수선용)
function nearestPairG(A, B){
  const xy = makeXY(ringsOf(A)[0][0]);
  let best = { d:Infinity };
  const run = (P, Q, flip) => {

// 주소·지번 여러 개 → 필지
function parseJibuns(text, def){
  const out = [], DONG = /(동|리|가|\d+가)$/;
  const JB = /^(산\s*)?(\d+(?:-\d+)?)(\s*번지)?$/;
  let prefix = def || "";
  const take = (pre, san, num) => { if (pre) prefix = pre; if (!prefix) return; out.push({ pre:prefix, san:!!san, num }); };
  String(text || "").split(/\r?\n/).forEach(line => {
    line = line.replace(/\s+일원|\s+일대|\s*외\s*\d+\s*필지/g, " ").trim(); if (!line) return;
    if (line.includes("\t")){
      const cells = line.split("\t").map(x => x.trim()).filter(Boolean);
      let di = -1, done = false;
      cells.forEach((c, i) => { if (done) return;
        const m = c.match(/^(.*\S)\s+(산\s*)?(\d+(?:-\d+)?)(\s*번지)?$/); if (m && DONG.test(m[1].split(/\s+/).pop())){ take(m[1], m[2], m[3]); done = true; return; }
        if (DONG.test(c.split(/\s+/).pop()) && /[가-힣]/.test(c)){ prefix = c; di = i; } });
      if (done) return;
      const jc = cells.map((c, i) => ({ c, i, m:c.match(JB) })).filter(x => x.m && x.i > di);
      if (!jc.length) return;
      const pk = di >= 0 ? jc[0] : (jc.find(x => x.c.includes("-")) || (jc.length > 1 ? jc[1] : jc[0]));
      take("", pk.m[1], pk.m[2]); return;
    }
    line.split(/[,，;·、]|\s{2,}/).map(x => x.trim()).filter(Boolean).forEach(tok => {
      const m = tok.match(/^(.*?)(?:\s+|^)(산\s*)?(\d+(?:-\d+)?)(\s*번지)?$/);
      if (!m) { if (DONG.test(tok.split(/\s+/).pop())) prefix = tok; return; }
      const pre = (m[1] || "").trim();
      if (pre && DONG.test(pre.split(/\s+/).pop())) take(pre, m[2], m[3]);
      else if (!pre) take("", m[2], m[3]);
      else { // "상남동 45-1 45-2" 처럼 띄어쓰기로만 이어진 경우
        const parts = tok.split(/\s+/); let pp = "";
        parts.forEach(p => { const q = p.match(JB); if (q && (pp || prefix)) take(pp, q[1], q[2]); else if (!q){ pp = (pp ? pp + " " : "") + p; } });
      }
    });
  });
  // 같은 것 빼기
  const seen = new Set(); return out.filter(x => { const k = x.pre + "|" + x.san + "|" + x.num; if (seen.has(k)) return false; seen.add(k); return true; });
}
function basePrefix(){
  const a = (state.project[0] && state.project[0].addr) || "";
  const parts = a.split(/\s+/); const i = parts.findIndex(p => /(동|리|가)$/.test(p) && !/^\d/.test(p));
  return i > 0 ? parts.slice(0, i).join(" ") : "";
}
async function geocodeParcel(addr, san, num){
  const d = await jsonp("https://api.vworld.kr/req/search", { service:"search", request:"search", version:"2.0", crs:"EPSG:4326", size:10, page:1,
    query:addr, type:"address", category:"parcel", format:"json", errorformat:"json", key:VW_KEY });
  const r = d && d.response, items = r && r.status === "OK" && r.result && r.result.items || [];
  const want = (san ? "산" : "") + num;
  const it = items.find(x => { const p = String((x.address && x.address.parcel) || x.title || "").replace(/\s+/g, " ").trim(); return p.endsWith(" " + want) || p.endsWith(" " + (san ? "산 " : "") + num); }) || null;
  return it ? [Number(it.point.x), Number(it.point.y)] : null;
}
let bulkBusy = false, bulkLeft = "";
async function bulkParcels(){
  if (bulkBusy) return;
  const ta = $("#bulkTxt"), bp = $("#bulkBase"); if (!ta) return;
  const base = (bp && bp.value.trim()) || "";
  const pnus = (ta.value.match(/\b\d{19}\b/g) || []);
  const a0 = ((state.project[0] && state.project[0].addr) || "").split(/\s+/), dong = a0.find(p => /(동|리|가)$/.test(p) && !/^\d/.test(p)) || "";
  const list = parseJibuns(ta.value.replace(/\b\d{19}\b/g, " "), dong);
  if (!list.length && !pnus.length){ toast("주소를 못 읽었어요. 예) 상남동 45-1, 45-2, 46", 4000); return; }
  bulkBusy = true; bulkLeft = ta.value; renderPanel();
  const have = new Set(state.project.map(p => p.pnu)), fails = []; let ok = 0, dup = 0, done = 0;
  const total = list.length + pnus.length;
  const prog = () => toast(`필지 넣는 중… ${done} / ${total}`, 60000);
  const addP = p => { if (!p) return false; if (have.has(p.pnu)){ dup++; return true; } have.add(p.pnu); state.project.push(p); ok++; return true; };
  const jobs = [
    ...pnus.map(pnu => async () => { try { const fs = await vwData("LP_PA_CBND_BUBUN", { attrFilter:`pnu:=:${pnu}` }); const f = fs[0];
      if (f){ const pt = turf.pointOnFeature(turf.feature(f.geometry)).geometry.coordinates; if (!addP(await parcelAt(pt[0], pt[1]))) fails.push(pnu); } else fails.push(pnu); } catch(e){ fails.push(pnu); } }),
    ...list.map(x => async () => {
      const full = /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충청|충북|충남|전라|전북|전남|경상|경북|경남|제주)/.test(x.pre) || !base ? x.pre : base + " " + x.pre;
      const label = `${x.pre} ${x.san ? "산" : ""}${x.num}`;
      try { const pt = await geocodeParcel(`${full} ${x.san ? "산" : ""}${x.num}`, x.san, x.num);
        if (!pt){ fails.push(label); return; }
        const p = await parcelAt(pt[0], pt[1]);
        if (!p || String(p.jibun).replace(/[^\d-]/g, "") !== x.num){ fails.push(label); return; }
        addP(p);
      } catch(e){ fails.push(label); } })
  ];
  let k = 0; prog();
  await Promise.all(Array.from({ length:4 }, async () => { while (k < jobs.length){ const j = jobs[k++]; await j(); done++; prog(); } }));
  bulkBusy = false;

async function exportPPT(){
  if (!map || pptBusy) return;
  const rows = state.schools.map(schoolRow);
  if (!state.project.length && !rows.length){ toast("사업지와 학교를 먼저 넣어 주세요"); return; }
  pptBusy = true;
  if (tilesOn() && tileCORS !== true) await startCapture();   // 클릭 바로 다음에 물어봐야 함
  toast("PPT 만드는 중… 화면이 몇 번 바뀌어요", 120000);
  try { await loadPptx(); } catch(e){ pptBusy = false; stopCapture(); toast("PPT 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요"); return; }
  const keep = { step, pr:{ ...state.print }, c:map.getCenter(), z:map.getZoom() };
  const pptx = new PptxGenJS(); pptx.title = state.name;
  if (state.print.pptSize === "a4"){ pptx.defineLayout({ name:"A4L", width:11.69, height:8.27 }); pptx.layout = "A4L"; PW = 11.69; PH = 8.27; } else { pptx.layout = "LAYOUT_WIDE"; PW = 13.333; PH = 7.5; }
  const SW = PW, SH = PH;

  try {
    goStep(4); await sleep(100);
    const jobs = [];
    evalItems(rows).filter(x => x.has && !(state.print.skip || []).includes(x.e.id)).forEach(x => {
      if (x.e.id === "ev_safe1" && x.phases.length > 1) x.phases.forEach(p => jobs.push({ x, title:`${x.e.fig.replace(/>$/, "")} - ${p.name}>`, phase:p.id, sub:p.name }));
      else jobs.push({ x, title:x.e.fig, phase: x.e.id === "ev_safe5" ? CRANE_PH() : "all", sub:"" });
      if (x.e.id === "ev_safe2") (x.secs || []).forEach(sec => jobs.push({ x, sec }));
      if (x.e.id === "ev_photo") for (let i = 0; i < state.photos.length; i += 4) jobs.push({ x, photos:state.photos.slice(i, i + 4), start:i });
    });
    for (const j of jobs){
      if (j.sec){ await secSlide(pptx, j.sec); n++; continue; }
      if (j.photos){ await photoSlide(pptx, j.photos, j.start); n++; continue; }
      state.print.preset = j.x.e.id; state.print.disp = null; state.print.title = j.title; state.print.phase = j.phase;
      layoutFrame(); map.invalidateSize(false); redraw(); applyFigView(); redraw(); await sleep(100);
      const bg = await bgCanvas(2); if (bg.missed) missed = true;
      const sz = map.getSize(); let h = SH, w = h * sz.x / sz.y; if (w > SW){ w = SW; h = w * sz.y / sz.x; }
      const box = { x:(SW - w) / 2, y:(SH - h) / 2, w, h };
      const sl = pptx.addSlide();
      sl.addImage({ data:bg.c.toDataURL("image/jpeg", 0.9).replace(/^data:/, ""), ...box });
      await pptShapes(pptx, sl, box);
      sl.addNotes(`${j.x.e.sec} ${j.x.e.name}${j.sub ? " - " + j.sub : ""}\n${j.title}`);
      n++;
    }
    if (schHas() && !(state.print.skip || []).includes("sched")){ await schedSlide(pptx); n++; }
    const fname = `${(state.name || "교육환경평가").replace(/[<>:"/\\|?*]/g, "").trim() || "교육환경평가"}_평가항목별 그림.pptx`;
    await savePptGrouped(pptx, fname);
    toast(missed ? `PPT로 저장했어요 (${n}장) · 바탕지도는 빠졌어요 (‘이 탭 공유’를 허용하면 담겨요)` : `PPT로 저장했어요 (평가항목 그림 ${n}장)`, 5000);
  } catch(e){ console.error(e); toast("PPT 만들기에 실패했어요"); }
  finally {
    stopCapture();
    Object.assign(state.print, keep.pr); save();
    goStep(keep.step); map.setView(keep.c, keep.z, { animate:false });
    pptBusy = false;
  }
}
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){ toast("복사에 실패했어요"); }
}

function buildSVG(ovData, opts = {}){

    const c = map.latLngToContainerPoint([o.center[1], o.center[0]]);
    const mpp = map.distance(map.containerPointToLatLng([c.x - 50, c.y]), map.containerPointToLatLng([c.x + 50, c.y])) / 100;
    const w = o.widthM / mpp, h = w / (o.aspect || 1);

    if (su) out.push(`<clipPath id="oc-${o.id}"><path clip-rule="evenodd" d="${polysOf(su).map(poly => poly.map(r => "M" + r.map(P).join("L") + "Z").join(" ")).join(" ")}"/></clipPath>`);
    out.push(`<g ${su ? `clip-path="url(#oc-${o.id})"` : ""}><image href="${ovData[o.id]}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" opacity="${o.opacity}" preserveAspectRatio="none" transform="translate(${c.x} ${c.y}) rotate(${o.rot})"/></g>`);
  });

    if (it.k === "poly") polysOf(it.geom).forEach(poly => out.push(`<path fill-rule="evenodd" d="${poly.map(r => "M" + r.map(P).join("L") + "Z").join(" ")}" ${it.fillOnly ? st(it.sk).replace(/stroke="[^"]*"/, 'stroke="none"') : it.lineOnly ? st(it.sk).replace(/fill="[^"]*"/, 'fill="none"') : it.col ? st(it.sk).replace(/fill="[^"]*"/, `fill="${it.col}"`).replace(/stroke="[^"]*"/, `stroke="${hexDark(it.col, 0.45)}"`) : st(it.sk)} stroke-linejoin="round"/>`));

      if (it.arrows || it.endArrow) arrowTris(it, c => map.latLngToContainerPoint([c[1], c[0]])).forEach(t => out.push(`<polygon points="${t.pts.map(q => q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" ")}" fill="${t.fill}" ${t.outline ? `stroke="${t.outline}" stroke-width="1"` : ""}/>`)); }

function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

/* ===== 바탕지도 담기 =====
   1) 브이월드 타일을 직접 그려 보고 (서버가 허용하면 묻지 않고 바로 됨)
   2) 안 되면 브라우저 ‘이 탭 공유’로 화면을 찍어서 지도 틀만 잘라 씀 */
let tileCORS = null, capStream = null, capVideo = null;
const MAP_PANES = ["tilePane", "zone", "cad"];
const tileImgs = () => MAP_PANES.flatMap(p => map && map.getPane(p) ? [...map.getPane(p).querySelectorAll("img.leaflet-tile")] : []);
const tilesOn = () => !!map && ly.withBase !== false && tileImgs().length > 0;
function loadCors(src){ return new Promise(res => { const t = new Image(); t.crossOrigin = "anonymous"; const to = setTimeout(() => res(null), 6000); t.onload = () => { clearTimeout(to); res(t); }; t.onerror = () => { clearTimeout(to); res(null); }; t.src = src; }); }
async function testTileCORS(){
  const im = tileImgs().find(i => i.classList.contains("leaflet-tile-loaded")); if (!im) return;
  const t = await loadCors(im.src);
  if (!t){ tileCORS = false; return; }
  try { const c = document.createElement("canvas"); c.width = c.height = 2; const g = c.getContext("2d"); g.drawImage(t, 0, 0); g.getImageData(0, 0, 1, 1); tileCORS = true; } catch(e){ tileCORS = false; }
}
async function waitTiles(max = 7000){
  const t0 = Date.now(); await sleep(200);
  while (Date.now() - t0 < max){ if (!tileImgs().some(im => !im.complete)) break; await sleep(150); }
  await sleep(200);
}
async function drawTiles(g){
  const mr = $("#map").getBoundingClientRect(); let ok = 0, bad = 0;
  for (const pn of MAP_PANES){
    const pane = map.getPane(pn); if (!pane) continue;
    for (const lay of pane.querySelectorAll(".leaflet-layer")){
      if (lay.style.display === "none") continue;
      const op = parseFloat(lay.style.opacity || "1");
      const ims = [...lay.querySelectorAll("img.leaflet-tile-loaded")];
      const got = await Promise.all(ims.map(im => loadCors(im.src)));
      ims.forEach((im, i) => { const t = got[i]; if (!t){ bad++; return; } ok++; const r = im.getBoundingClientRect(); g.globalAlpha = op; g.drawImage(t, r.left - mr.left, r.top - mr.top, r.width, r.height); });
    }
  }
  g.globalAlpha = 1;
  try { g.getImageData(0, 0, 1, 1); } catch(e){ return { ok:0, bad:1 }; }
  return { ok, bad };
}
function drawMask(g){
  const su = siteUnion(); if (!su || ly.siteMask === false || !dispNow().project) return;
  g.beginPath();
  polysOf(su).forEach(poly => poly.forEach(r => r.forEach((c, i) => { const p = map.latLngToContainerPoint([c[1], c[0]]); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); })));
  g.fillStyle = "#ffffff"; g.fill("evenodd");
}
async function startCapture(){
  if (capVideo) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return false;
  try { capStream = await navigator.mediaDevices.getDisplayMedia({ video:{ displaySurface:"browser", frameRate:15 }, audio:false, preferCurrentTab:true, selfBrowserSurface:"include", surfaceSwitching:"exclude" }); }
  catch(e){ capStream = null; return false; }
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.srcObject = capStream;
  try { await v.play(); } catch(e){}
  capVideo = v; capStream.getVideoTracks()[0].addEventListener("ended", stopCapture);
  await sleep(300); return true;
}
function stopCapture(){ if (capStream) capStream.getTracks().forEach(t => t.stop()); capStream = null; capVideo = null; }
function freshFrame(){ return new Promise(res => { const v = capVideo; let n = 0; const done = () => setTimeout(res, 60); if (v && v.requestVideoFrameCallback){ const f = () => { if (++n >= 3) done(); else v.requestVideoFrameCallback(f); }; v.requestVideoFrameCallback(f); setTimeout(res, 1500); } else setTimeout(res, 600); }); }
function grabFrame(){
  const v = capVideo; if (!v || !v.videoWidth) return null;
  const mr = $("#map").getBoundingClientRect(), sx = v.videoWidth / window.innerWidth, sy = v.videoHeight / window.innerHeight;
  if (Math.abs(sx - sy) / sx > 0.05){ toast("‘이 탭’을 골라 공유해 주세요 (다른 창·화면은 잘라낼 수 없어요)", 5000); return null; }
  const c = document.createElement("canvas"); c.width = Math.round(mr.width * sx); c.height = Math.round(mr.height * sy);
  c.getContext("2d").drawImage(v, mr.left * sx, mr.top * sy, mr.width * sx, mr.height * sy, 0, 0, c.width, c.height);
  return c;
}
function loadSvgImg(svg){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
// 지도 틀 크기의 바탕 그림 (바탕지도 + 레이어 + 붙인 도면). 그린 선·글씨는 안 들어감
async function bgCanvas(k){
  const sz = map.getSize(), W = sz.x, H = sz.y;
  const c = document.createElement("canvas"); c.width = Math.round(W * k); c.height = Math.round(H * k);
  const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.scale(k, k); g.imageSmoothingQuality = "high";
  const tiles = tilesOn();
  if (tiles) await waitTiles();
  if (tiles && capVideo){
    document.body.classList.add("bgshot"); await freshFrame(); const f = grabFrame(); document.body.classList.remove("bgshot");
    if (f){ g.drawImage(f, 0, 0, W, H); return { c, g, how:"cap", missed:false }; }
  }
  let how = "none";
  if (tiles){ const r = await drawTiles(g); if (r.ok) how = "tiles"; else if (r.bad) tileCORS = false; }
  drawMask(g);
  const ov = await overlayData();
  if (Object.keys(ov).length){ try { g.drawImage(await loadSvgImg(buildSVG(ov, { only:"overlay" }).svg), 0, 0, W, H); } catch(e){} }
  return { c, g, how, missed: tiles && how === "none" };
}

}

/* ---- 파일 종류 알아보기 + 끌어다 놓기 ---- */
async function sniffKind(f){
  const nm = f.name || "";
  if (/\.(zip|shp|dbf|prj|cpg|shx|geojson)$/i.test(nm)) return /보관함/.test(nm) ? "lib" : "szone";
  if (/\.(pdf|png|jpe?g|webp)$/i.test(nm)) return "ov";
  if (/\.dxf$/i.test(nm)) return "dxf";
  let head = "";
  try { head = (await readTextFile(f.slice(0, 65536))).split(/\r?\n/)[0] || ""; } catch(e){}
  if (/\.json$/i.test(nm)) return /FeatureCollection|"Feature"/.test(head + nm) ? "szone" : "";
  if (!/\.(csv|txt)$/i.test(nm)) return "";
  const s = (nm + " " + head).replace(/\s+/g, "");
  if (/옐로|yellow/i.test(s)) return "yc";
  if (/자전거도로|보행자전용도로/.test(s)) return "line";
  if (/횡단보도/.test(s)) return "cw";
  if (/어린이보호구역|대상시설명|보호구역도로폭/.test(s)) return "kid";
  if (/CCTV|카메라대수|촬영방면/i.test(s)) return "cctv";
  if (/정류장|정류소/.test(s)) return "bus";
  return "";
}
const KIND_N = k => k === "dxf" ? "캐드 도면 (DXF)" : k === "ov" ? "배치도·도면" : k === "lib" ? "자료 보관함 파일" : IMP[k] ? IMP[k].n : "모르는 파일";
let dropQ = [];
async function takeFiles(files){
  if (!files.length) return;
  const loose = files.filter(f => /\.(shp|dbf|prj|cpg|shx)$/i.test(f.name)), rest = files.filter(f => !loose.includes(f));
  const items = [];
  if (loose.length) items.push({ files:loose, kind:"szone", name:loose.map(f => f.name).join(", ") });
  for (const f of rest) items.push({ files:[f], kind:await sniffKind(f), name:f.name });
  if (wz && $("#dlgBack").style.display !== "flex") wz = null;
  if (wz){ wz.files.push(...items.filter(x => IMP[x.kind])); for (const x of items.filter(x => IMP[x.kind])){ await libSave(x.kind, x.files); const L = libMeta(); wz.lib.add(L[L.length - 1].id); }
    if (items.some(x => !IMP[x.kind])) toast("학구도·CSV 자료가 아닌 파일은 빼 두었어요. 배치도는 끝난 뒤 사업지 화면에 놓아 주세요", 4500);
    renderWizard(); return; }
  dropQ = items; openDropDlg();
}

async function dropGo(){
  const toLib = $("#dropLib") ? $("#dropLib").checked : libAuto(), Q = dropQ; dropQ = []; closeDlg();

  return all.map((f, i) => { const hay = (f[0] + " " + f[1] + " " + f[4]).toLowerCase().replace(/[′'‐−-]/g, ""); const sc = toks.every(t => hay.includes(t)) ? (f[0].toLowerCase().replace(/[′'‐−-]/g, "").includes(toks[0]) ? 2 : 1) : 0; return [i, sc]; })

}

let secEls = [];
function addSecChips(){
  const Pn = $("#panel"); secEls = [];
  if (drawer || ["home","export"].includes(nav.k)) return;
  const hd = Pn.querySelector(".nhead"); if (!hd) return;
  const seen = new Set(), out = [];
  Pn.querySelectorAll(".card > b, .card b.ft, .card > .row > b, div.lab, details > summary").forEach(el => {
    if (el.closest(".nhead") || el.closest(".secchips")) return;
    const first = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    let t = (first ? first.textContent : el.textContent).replace(/[▾()]/g, " ").replace(/\s+/g, " ").trim();
    if (!t || t.length < 2 || /^\d+$/.test(t)) return;
    if (t.length > 16) t = t.slice(0, 15) + "…";
    if (seen.has(t)) return; seen.add(t); out.push([t, el]);
  });
  if (out.length < 3) return;
  secEls = out.slice(0, 14).map(x => x[1]);
  const bar = document.createElement("div"); bar.className = "secchips"; bar.setAttribute("aria-label", "이 화면 바로가기");
  bar.innerHTML = out.slice(0, 14).map(([t], i) => `<button data-secchip="${i}">${esc(t)}</button>`).join("");
  hd.after(bar);
}
function goSecChip(i){
  const el = secEls[i]; if (!el) return;

  if (box.scrollIntoView) box.scrollIntoView({ block:"start", behavior:"smooth" });
  box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
}
