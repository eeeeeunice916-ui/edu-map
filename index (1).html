<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육환경 위치도</title>
<script>
  // 네이버 지도는 페이지 처음에 불러와야 함. 키 형식(ncpKeyId/ncpClientId)은 실패 시 자동 전환
  window.__errs = [];
  window.addEventListener("error", e => window.__errs.push((e.message || "오류") + (e.filename ? " @" + e.filename.split("/").pop() + ":" + e.lineno : "")));
  (function(){
    var p = "ncpKeyId"; try { p = sessionStorage.getItem("nvParam") || "ncpKeyId"; } catch(e){}
    window.__nvParam = p;
    document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?' + p + '=880g164msx"><\/script>');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --sub:#6b7280; --line:#e5e7eb; --soft:#f6f7f9;
  --proj:#e5484d; --school:#2f6fdf; --gate:#f08c00; --ok:#1a7f37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif);font-size:15px}
button,input,select{font-family:inherit}
#mapMsg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:20;display:none;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;line-height:1.6;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#app{display:flex;flex-direction:column;height:100%}
#mapWrap{position:relative;height:56vh;min-height:300px;flex:none}
#map{position:absolute;inset:0}
#panel{flex:1;overflow:auto;padding:14px 16px 40px;border-top:1px solid var(--line)}
@media (min-width:900px){
  #app{flex-direction:row}
  #mapWrap{height:100%;flex:1}
  #panel{width:420px;flex:none;border-top:none;border-left:1px solid var(--line)}
}
/* 지도 위 컨트롤 */
.top{position:absolute;left:10px;right:10px;top:10px;z-index:10}
.searchRow{display:flex;gap:6px}
.searchRow input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn.on{background:#eef3ff;border-color:var(--school);color:var(--school)}
.results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.results div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.results div:last-child{border-bottom:none}
.results small{color:var(--sub)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#modeBar{position:absolute;left:10px;right:10px;bottom:12px;z-index:10;display:none;align-items:center;gap:8px;
  background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#modeBar span{flex:1;font-size:14px;line-height:1.35}
#modeBar button{background:#fff;color:var(--ink);border:none;border-radius:8px;height:34px;padding:0 14px;font-size:14px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;
  padding:9px 14px;border-radius:10px;font-size:14px;z-index:50;display:none;max-width:90vw}
#zoneHint{position:absolute;right:10px;bottom:60px;z-index:9;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub);display:none}
/* 패널 */
h1{font-size:18px;margin:0}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:10px;height:10px;border-radius:3px}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.parcel{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.parcel:last-child{border-bottom:none}
.parcel .t{flex:1;line-height:1.45}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px}
input.name{flex:1;min-width:120px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px}
select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:14px;background:#fff}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--sub)}
.badge.abs{background:#fff1e0;color:#b45309}
.badge.rel{background:#eef3ff;color:var(--school)}
.badge.out{background:#eaf6ec;color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:600}
.sumbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.iw{font-family:var(--font,inherit);padding:10px 12px;font-size:13px;line-height:1.5;max-width:240px}
.iw b{font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <div id="map"></div>
    <div id="mapMsg"></div>
    <div class="top">
      <div class="searchRow">
        <input id="q" placeholder="주소·지번·학교 이름 검색" enterkeyhint="search">
        <button class="btn pri" id="qBtn">검색</button>
      </div>
      <div class="results" id="results" style="display:none"></div>
      <div class="chips">
        <button class="chip on" id="chipCad">지적편집도</button>
        <button class="chip" id="chipZone">용도지역</button>
        <button class="chip" id="chipSat">위성지도</button>
        <button class="chip" id="chipFit">전체 보기</button>
      </div>
    </div>
    <div id="zoneHint">용도지역은 조금 더 확대하면 보여요</div>
    <div id="modeBar"><span id="modeText"></span><button id="modeDone">완료</button></div>
  </div>

  <div id="panel">
    <div class="head">
      <h1>교육환경 위치도</h1>
      <div class="row"><button class="btn sm" id="setBtn">글씨</button><button class="btn sm" id="resetBtn">새로 시작</button></div>
    </div>
    <div class="card" id="setCard" style="display:none">
      <div class="row"><b style="width:56px">글씨체</b><select id="fontSel" style="flex:1"></select></div>
      <div class="row" style="margin-top:8px"><b style="width:56px">크기</b>
        <select id="sizeSel" style="flex:1"><option value="13">작게</option><option value="15">보통</option><option value="17">크게</option><option value="19">아주 크게</option></select></div>
    </div>
    <div class="muted">지도를 누르면 그 자리 필지의 지번·지목·용도지역·공시지가가 나와요. 거리·면적은 도면 기준 참고값이에요.</div>

    <h2><span class="dot" style="background:var(--proj)"></span>사업지</h2>
    <div class="card">
      <div class="row"><button class="btn sm" id="projBtn">필지 선택</button><span class="muted">지도에서 필지를 눌러 넣고 빼요</span></div>
      <div id="projList"></div>
      <div id="projSum"></div>
    </div>

    <h2><span class="dot" style="background:var(--school)"></span>학교</h2>
    <div id="schoolList"></div>
    <button class="btn sm" id="addSchool">+ 학교 추가</button>

    <h2>위치항목 조사결과</h2>
    <div id="resultBox" class="muted">사업지와 학교를 넣으면 여기에 표가 만들어져요.</div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 설정 ===== */
const APP_VERSION = "1.1";
const NAVER_ID = "880g164msx";
const VW_KEY = "1C3C3956-A882-416D-8DE7-3A232A4B096B";
const DOMAIN = location.origin;            // 브이월드에 등록한 서비스URL과 같아야 함
const STORE = "eduMap.v1";
const KINDS = ["유치원","초등학교","중학교","고등학교","특수학교","대학교","기타"];

/* ===== 공통 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ko-KR");
let toastT;
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none", ms); }

let state = { project: [], schools: [] };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.project) state = s; } catch(e){}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

/* ===== 브이월드 (JSONP) ===== */
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cb = "vwcb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); reject(new Error("응답 시간 초과")); }, 12000);
    window[cb] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("불러오기 실패")); };
    sc.src = url + "?" + qs;
    document.head.appendChild(sc);
  });
}
async function vwData(layer, extra){
  const d = await jsonp("https://api.vworld.kr/req/data", {
    service:"data", version:"2.0", request:"GetFeature", data:layer, key:VW_KEY, domain:DOMAIN,
    format:"json", errorformat:"json", size:10, page:1, geometry:"true", attribute:"true", crs:"EPSG:4326", ...extra
  });
  const r = d && d.response;
  if (!r) throw new Error("응답 없음");
  if (r.status === "NOT_FOUND") return [];
  if (r.status !== "OK") throw new Error((r.error && (r.error.text || r.error.code)) || r.status);
  return (r.result && r.result.featureCollection && r.result.featureCollection.features) || [];
}
async function zoneAt(lng, lat){
  const layers = ["LT_C_UQ111","LT_C_UQ112","LT_C_UQ113","LT_C_UQ114"];
  const out = await Promise.all(layers.map(l =>
    vwData(l, { geomFilter:`POINT(${lng} ${lat})`, geometry:"false" }).catch(() => [])));
  const names = [];
  out.flat().forEach(f => { const n = f.properties && (f.properties.uname || f.properties.UNAME); if (n && !names.includes(n)) names.push(n); });
  return names.join(", ");
}
async function parcelAt(lng, lat){
  const fs = await vwData("LP_PA_CBND_BUBUN", { geomFilter:`POINT(${lng} ${lat})` });
  if (!fs.length) return null;
  const f = fs[0], p = f.properties || {};
  const jibun = p.jibun || "";
  const jimok = (jibun.match(/[가-힣]+$/) || [""])[0];
  const parcel = {
    pnu: p.pnu, addr: p.addr || "", jibun, jimok,
    jiga: p.jiga ? Number(p.jiga) : null, year: p.gosi_year || "",
    geom: f.geometry, zone: ""
  };
  try {
    const pt = turf.pointOnFeature(turf.feature(f.geometry)).geometry.coordinates;
    parcel.zone = await zoneAt(pt[0], pt[1]);
  } catch(e){}
  return parcel;
}
async function vwSearch(q){
  const road = /(로|길)\s*\d/.test(q);
  const tries = [
    { type:"address", category: road ? "road" : "parcel" },
    { type:"address", category: road ? "parcel" : "road" },
    { type:"place" }
  ];
  for (const t of tries){
    try {
      const d = await jsonp("https://api.vworld.kr/req/search", {
        service:"search", request:"search", version:"2.0", crs:"EPSG:4326", size:8, page:1,
        query:q, format:"json", errorformat:"json", key:VW_KEY, ...t
      });
      const r = d && d.response;
      if (r && r.status === "OK" && r.result && r.result.items && r.result.items.length){
        return r.result.items.map(it => ({
          title: t.type === "place" ? it.title : (it.address && (it.address.parcel || it.address.road)) || it.title,
          sub: t.type === "place" ? ((it.address && (it.address.road || it.address.parcel)) || "") : ((it.address && it.address.road) || ""),
          x: Number(it.point.x), y: Number(it.point.y)
        }));
      }
    } catch(e){}
  }
  return [];
}

/* ===== 기하 계산 (미터) ===== */
function polysOf(g){ return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; }
function ringsOf(g){ return polysOf(g).flat(); }
function makeXY(ref){ const k = Math.cos(ref[1]*Math.PI/180)*111320; return c => [(c[0]-ref[0])*k, (c[1]-ref[1])*110574]; }
function segDist(p, a, b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
  let t = L ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}
function vertsToEdges(A, B, xy){
  let m = Infinity;
  for (const ra of ringsOf(A)) for (const v of ra){
    const p = xy(v);
    for (const rb of ringsOf(B)) for (let i=0;i<rb.length-1;i++) m = Math.min(m, segDist(p, xy(rb[i]), xy(rb[i+1])));
  }
  return m;
}
function geomDist(A, B){
  try { if (turf.booleanIntersects(turf.feature(A), turf.feature(B))) return 0; } catch(e){}
  const xy = makeXY(ringsOf(A)[0][0]);
  return Math.min(vertsToEdges(A,B,xy), vertsToEdges(B,A,xy));
}
function setDist(As, Bs){ let m = Infinity; As.forEach(a => Bs.forEach(b => m = Math.min(m, geomDist(a,b)))); return m; }
function pointDist(pt, Gs){
  let m = Infinity;
  const xy = makeXY(pt), p = xy(pt);
  for (const g of Gs){
    try { if (turf.booleanPointInPolygon(turf.point(pt), turf.feature(g))) return 0; } catch(e){}
    for (const r of ringsOf(g)) for (let i=0;i<r.length-1;i++) m = Math.min(m, segDist(p, xy(r[i]), xy(r[i+1])));
  }
  return m;
}
function centroidOf(Gs){ return turf.centroid(turf.featureCollection(Gs.map(g => turf.feature(g)))).geometry.coordinates; }
const DIRS = ["북","북동","동","남동","남","남서","서","북서"];
function dirName(from, to){ let b = turf.bearing(turf.point(from), turf.point(to)); b = (b+360)%360; return DIRS[Math.round(b/45)%8]; }
function areaOf(Gs){ return Gs.reduce((s,g) => s + turf.area(turf.feature(g)), 0); }

/* ===== 지도 ===== */
let map, cadLayer, zoneOverlay = null, zoneOn = false, infoWin, drawn = [];
let mode = null; // null | {type:'project'} | {type:'school', id} | {type:'gate', id}

function mapMsg(html){ const d = $("#mapMsg"); d.innerHTML = html; d.style.display = "block"; }
function nvParam(){ try { return sessionStorage.getItem("nvParam") || "ncpKeyId"; } catch(e){ return "ncpKeyId"; } }
// 키 형식이 맞지 않으면 다른 형식(ncpClientId)으로 한 번 더 시도
window.navermap_authFailure = function(){
  if (nvParam() === "ncpKeyId"){
    try { sessionStorage.setItem("nvParam", "ncpClientId"); location.reload(); return; } catch(e){}
  }
  try { sessionStorage.removeItem("nvParam"); } catch(e){}
  mapMsg(`<b>네이버 지도 인증 실패</b><br>네이버 클라우드 콘솔 → Maps → Application(Client ID <b>${NAVER_ID}</b>) → 수정 → <b>Web 서비스 URL</b>에<br><b>${esc(location.origin)}</b><br>이 등록돼 있는지, Dynamic Map이 체크돼 있는지 확인해 주세요.`);
};
function loadNaver(){
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?${nvParam()}=${NAVER_ID}`;
  s.onload = initMap;
  s.onerror = () => mapMsg("<b>네이버 지도를 불러오지 못했어요</b><br>인터넷 연결을 확인하고 새로고침해 주세요.");
  document.head.appendChild(s);
}

function initMap(){
  if (!window.naver || !naver.maps || !naver.maps.Map){ mapMsg("<b>네이버 지도를 불러오지 못했어요</b><br>새로고침해 주세요."); return; }
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(37.5665, 126.9780), zoom: 16,
    scaleControl: true, mapDataControl: false, logoControlOptions:{ position: naver.maps.Position.BOTTOM_LEFT },
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
  });
  cadLayer = new naver.maps.CadastralLayer();
  naver.maps.Event.once(map, "init", () => cadLayer.setMap(map));
  infoWin = new naver.maps.InfoWindow({ content:"", borderColor:"#e5e7eb", anchorSize:new naver.maps.Size(10,8) });
  naver.maps.Event.addListener(map, "click", e => onMapClick(e.coord.lng(), e.coord.lat()));
  naver.maps.Event.addListener(map, "idle", updateZone);
  redraw(); renderPanel();
  if (state.project.length || state.schools.length) fitAll();
}

function updateZone(){
  if (!zoneOn){ $("#zoneHint").style.display="none"; return; }
  if (map.getZoom() < 13){ $("#zoneHint").style.display="block"; if (zoneOverlay){ zoneOverlay.setMap(null); zoneOverlay=null; } return; }
  $("#zoneHint").style.display="none";
  const b = map.getBounds(), sz = map.getSize();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(sz.width*dpr), h = Math.round(sz.height*dpr);
  const s = Math.min(1, 2048/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
  const L = "lt_c_uq111,lt_c_uq112,lt_c_uq113,lt_c_uq114";
  const url = "https://api.vworld.kr/req/wms?" + new URLSearchParams({
    SERVICE:"WMS", VERSION:"1.3.0", REQUEST:"GetMap", LAYERS:L, STYLES:L, CRS:"EPSG:4326",
    BBOX:[b.minY(), b.minX(), b.maxY(), b.maxX()].join(","), WIDTH:w, HEIGHT:h,
    FORMAT:"image/png", TRANSPARENT:"true", KEY:VW_KEY, DOMAIN:DOMAIN
  }).toString();
  const old = zoneOverlay;
  zoneOverlay = new naver.maps.GroundOverlay(url, b, { opacity:0.55, clickable:false });
  zoneOverlay.setMap(map);
  if (old) setTimeout(() => old.setMap(null), 400);
}

function pathsOf(g){ return polysOf(g).map(poly => poly.map(ring => ring.map(c => new naver.maps.LatLng(c[1], c[0])))); }
function addPoly(g, o){
  pathsOf(g).forEach(paths => drawn.push(new naver.maps.Polygon({ map, paths, clickable:false, ...o })));
}
function redraw(){
  if (!map) return;
  drawn.forEach(o => o.setMap(null)); drawn = [];
  state.schools.forEach(s => {
    const gs = s.parcels.map(p => p.geom);
    if (gs.length){
      let buf = null;
      try {
        const bs = gs.map(g => turf.buffer(turf.feature(g), 200, { units:"meters" }));
        buf = bs.length > 1 ? turf.union(turf.featureCollection(bs)) : bs[0];
      } catch(e){}
      if (buf) addPoly(buf.geometry, { fillColor:"#2f6fdf", fillOpacity:0.07, strokeColor:"#2f6fdf", strokeOpacity:0.9, strokeWeight:2, strokeStyle:"shortdash" });
      gs.forEach(g => addPoly(g, { fillColor:"#2f6fdf", fillOpacity:0.28, strokeColor:"#2f6fdf", strokeWeight:2 }));
      const c = centroidOf(gs);
      drawn.push(new naver.maps.Marker({ map, clickable:false, position:new naver.maps.LatLng(c[1], c[0]),
        icon:{ content:`<div style="transform:translate(-50%,-50%);background:#2f6fdf;color:#fff;font-size:12px;padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:600">${esc(s.name)}</div>`, anchor:new naver.maps.Point(0,0) } }));
    }
    if (s.gate){
      const ll = new naver.maps.LatLng(s.gate[1], s.gate[0]);
      drawn.push(new naver.maps.Circle({ map, center:ll, radius:50, clickable:false, fillColor:"#f08c00", fillOpacity:0.15, strokeColor:"#f08c00", strokeWeight:2 }));
      drawn.push(new naver.maps.Marker({ map, clickable:false, position:ll,
        icon:{ content:`<div style="transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#f08c00;border:2px solid #fff;box-shadow:0 0 0 1px #f08c00"></div>`, anchor:new naver.maps.Point(0,0) } }));
    }
  });
  state.project.forEach(p => addPoly(p.geom, { fillColor:"#e5484d", fillOpacity:0.3, strokeColor:"#e5484d", strokeWeight:3 }));
}
function fitAll(){
  const gs = [...state.project.map(p=>p.geom), ...state.schools.flatMap(s => s.parcels.map(p=>p.geom))];
  const pts = gs.flatMap(ringsOf).flat();
  state.schools.forEach(s => s.gate && pts.push(s.gate));
  if (!pts.length){ toast("아직 넣은 사업지·학교가 없어요"); return; }
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  map.fitBounds(new naver.maps.LatLngBounds(new naver.maps.LatLng(Math.min(...ys), Math.min(...xs)), new naver.maps.LatLng(Math.max(...ys), Math.max(...xs))), { top:110, right:30, bottom:40, left:30 });
}

/* ===== 지도 클릭 ===== */
async function onMapClick(lng, lat){
  infoWin.close();
  if (mode && mode.type === "gate"){
    const s = state.schools.find(x => x.id === mode.id);
    if (s){ s.gate = [lng, lat]; save(); redraw(); renderPanel(); toast(`${s.name} 출입문을 찍었어요`); }
    setMode(null); return;
  }
  toast("필지 확인 중…", 8000);
  let p;
  try { p = await parcelAt(lng, lat); }
  catch(e){ toast("브이월드 조회 실패: " + e.message, 5000); return; }
  if (!p){ toast("이 자리에 필지 정보가 없어요"); return; }
  $("#toast").style.display = "none";

  if (mode && mode.type === "project"){
    toggle(state.project, p, "사업지");
  } else if (mode && mode.type === "school"){
    const s = state.schools.find(x => x.id === mode.id);
    if (s) toggle(s.parcels, p, s.name);
  } else {
    infoWin.setContent(`<div class="iw"><b>${esc(p.addr)}</b><br>지목 ${esc(p.jimok || "-")} · ${esc(p.zone || "용도지역 정보 없음")}<br>${p.jiga ? `공시지가 ${fmt(p.jiga)}원/㎡${p.year ? ` (${esc(p.year)})` : ""}` : ""}<br><span style="color:#6b7280">도면면적 약 ${fmt(areaOf([p.geom]))}㎡</span></div>`);
    infoWin.open(map, new naver.maps.LatLng(lat, lng));
  }
}
function toggle(list, p, label){
  const i = list.findIndex(x => x.pnu === p.pnu);
  if (i >= 0){ list.splice(i,1); toast(`${label}에서 뺐어요`); }
  else { list.push(p); toast(`${label}에 넣었어요`); }
  save(); redraw(); renderPanel();
}
function setMode(m){
  mode = m;
  const bar = $("#modeBar");
  if (!m){ bar.style.display = "none"; renderPanel(); return; }
  const s = m.id ? state.schools.find(x => x.id === m.id) : null;
  $("#modeText").textContent =
    m.type === "project" ? "사업지 필지를 눌러 넣고 빼세요" :
    m.type === "school" ? `${s ? s.name : "학교"} 부지 필지를 눌러 넣고 빼세요` :
    `${s ? s.name : "학교"} 출입문 위치를 한 번 누르세요`;
  bar.style.display = "flex";
  renderPanel();
}

/* ===== 패널 ===== */
function parcelRow(p, kind, sid){
  return `<div class="parcel"><div class="t">${esc(p.addr)}<br><span class="muted">지목 ${esc(p.jimok || "-")} · ${esc(p.zone || "-")}${p.jiga ? ` · ${fmt(p.jiga)}원/㎡` : ""} · 약 ${fmt(areaOf([p.geom]))}㎡</span></div>
  <button class="x" data-del="${kind}" data-pnu="${esc(p.pnu)}" ${sid ? `data-sid="${sid}"` : ""}>✕</button></div>`;
}
function uniq(a){ return [...new Set(a.filter(Boolean))]; }
function calc(){
  const pg = state.project.map(p => p.geom);
  if (!pg.length) return [];
  const pc = centroidOf(pg);
  return state.schools.filter(s => s.parcels.length || s.gate).map(s => {
    const sg = s.parcels.map(p => p.geom);
    const dB = sg.length ? setDist(pg, sg) : null;
    const dG = s.gate ? pointDist(s.gate, pg) : null;
    const sc = sg.length ? centroidOf(sg) : s.gate;
    const dir = dirName(sc, pc);
    let zone = "보호구역 외";
    if (dG !== null && dG <= 50) zone = "절대보호구역";
    else if (dB !== null && dB <= 200) zone = "상대보호구역";
    return { s, dB, dG, dir, zone };
  });
}
function m(v){ return v === null ? "-" : v === 0 ? "0m (접함·포함)" : `약 ${fmt(v)}m`; }
function renderPanel(){
  // 사업지
  $("#projBtn").classList.toggle("on", !!(mode && mode.type === "project"));
  $("#projList").innerHTML = state.project.map(p => parcelRow(p, "proj")).join("");
  if (state.project.length){
    const first = state.project[0];
    $("#projSum").innerHTML = `<div class="sumbox" style="margin-top:8px">
      <b>소재지</b> ${esc(first.addr)}${state.project.length > 1 ? ` 외 ${state.project.length-1}필지` : ""}<br>
      <b>지목</b> ${esc(uniq(state.project.map(p=>p.jimok)).join(", ") || "-")}<br>
      <b>용도지역</b> ${esc(uniq(state.project.flatMap(p=>(p.zone||"").split(", "))).join(", ") || "-")}<br>
      <b>면적</b> 약 ${fmt(areaOf(state.project.map(p=>p.geom)))}㎡ <span class="muted">(도면 기준, 대장면적과 다를 수 있음)</span></div>`;
  } else $("#projSum").innerHTML = "";

  // 학교
  $("#schoolList").innerHTML = state.schools.map(s => {
    const selOn = mode && mode.type === "school" && mode.id === s.id;
    const gateOn = mode && mode.type === "gate" && mode.id === s.id;
    return `<div class="card">
      <div class="row">
        <input class="name" data-name="${s.id}" value="${esc(s.name)}">
        <select data-kind="${s.id}">${KINDS.map(k => `<option ${k===s.kind?"selected":""}>${k}</option>`).join("")}</select>
        <button class="x" data-delschool="${s.id}">✕</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm ${selOn?"on":""}" data-sel="${s.id}">부지 선택 (${s.parcels.length})</button>
        <button class="btn sm ${gateOn?"on":""}" data-gate="${s.id}">출입문 ${s.gate ? "다시 찍기" : "찍기"}</button>
        ${s.gate ? `<span class="badge">출입문 ✓</span>` : ""}
      </div>
      ${s.parcels.map(p => parcelRow(p, "school", s.id)).join("")}
    </div>`;
  }).join("");

  // 결과
  const rows = calc();
  if (!state.project.length || !rows.length){
    $("#resultBox").className = "muted";
    $("#resultBox").innerHTML = "사업지와 학교(부지 또는 출입문)를 넣으면 여기에 표가 만들어져요.";
    return;
  }
  $("#resultBox").className = "";
  $("#resultBox").innerHTML = `
    <table>
      <tr><th>학교명</th><th>학교에서 본<br>사업지 방향</th><th>학교경계~<br>사업지</th><th>출입문~<br>사업지</th><th>구분</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.s.name)}</td><td>${r.dir}측</td><td>${m(r.dB)}</td><td>${m(r.dG)}</td>
        <td><span class="badge ${r.zone==="절대보호구역"?"abs":r.zone==="상대보호구역"?"rel":"out"}">${r.zone}</span></td></tr>`).join("")}
    </table>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" id="copyTable">표 복사</button>
      <button class="btn sm" id="copyText">문장 복사</button>
    </div>
    <div class="muted" style="margin-top:8px">출입문을 안 찍은 학교는 절대보호구역(출입문 50m) 판단이 빠져요.</div>`;
  $("#copyTable").onclick = () => copy(["학교명\t학교에서 본 사업지 방향\t학교경계~사업지\t출입문~사업지\t구분",
    ...rows.map(r => [r.s.name, r.dir+"측", m(r.dB), m(r.dG), r.zone].join("\t"))].join("\n"), "표를 복사했어요 (엑셀·한글에 붙여넣기)");
  $("#copyText").onclick = () => copy(rows.map(sentence).join("\n"), "문장을 복사했어요");
}
function sentence(r){
  const n = r.s.name;
  if (r.zone === "절대보호구역") return `사업지는 ${n} 출입문으로부터 약 ${fmt(r.dG)}m 이격되어 ${n} 절대보호구역 내에 위치함.`;
  if (r.zone === "상대보호구역") return `사업지는 ${n} ${r.dir}측으로 학교경계로부터 약 ${fmt(r.dB)}m 이격되어 ${n} 상대보호구역 내에 위치함.`;
  return `사업지는 ${n} ${r.dir}측으로 ${r.dB !== null ? `학교경계로부터 약 ${fmt(r.dB)}m` : `출입문으로부터 약 ${fmt(r.dG)}m`} 이격되어 교육환경보호구역 밖에 위치함.`;
}
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){ toast("복사에 실패했어요"); }
}

/* ===== 이벤트 ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.del === "proj"){ state.project = state.project.filter(p => p.pnu !== t.dataset.pnu); save(); redraw(); renderPanel(); }
  else if (t.dataset.del === "school"){ const s = state.schools.find(x => x.id === t.dataset.sid); if (s){ s.parcels = s.parcels.filter(p => p.pnu !== t.dataset.pnu); save(); redraw(); renderPanel(); } }
  else if (t.dataset.delschool){ const s = state.schools.find(x => x.id === t.dataset.delschool); if (s && confirm(`${s.name}을(를) 지울까요?`)){ state.schools = state.schools.filter(x => x !== s); if (mode && mode.id === s.id) setMode(null); save(); redraw(); renderPanel(); } }
  else if (t.dataset.sel){ setMode(mode && mode.type==="school" && mode.id===t.dataset.sel ? null : { type:"school", id:t.dataset.sel }); }
  else if (t.dataset.gate){ setMode(mode && mode.type==="gate" && mode.id===t.dataset.gate ? null : { type:"gate", id:t.dataset.gate }); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.name){ const s = state.schools.find(x => x.id === t.dataset.name); if (s){ s.name = t.value.trim() || s.name; save(); redraw(); renderPanel(); } }
  if (t.dataset.kind){ const s = state.schools.find(x => x.id === t.dataset.kind); if (s){ s.kind = t.value; save(); } }
});
$("#projBtn").onclick = () => setMode(mode && mode.type === "project" ? null : { type:"project" });
$("#modeDone").onclick = () => setMode(null);
$("#addSchool").onclick = () => {
  const id = "s" + Date.now();
  state.schools.push({ id, name:`학교${state.schools.length+1}`, kind:"초등학교", parcels:[], gate:null });
  save(); setMode({ type:"school", id });
  toast("이름을 고치고, 지도에서 학교 부지 필지를 눌러 주세요", 3500);
};
$("#resetBtn").onclick = () => {
  if (!confirm("사업지와 학교를 모두 지우고 새로 시작할까요?")) return;
  state = { project:[], schools:[] }; save(); setMode(null); redraw(); renderPanel();
};
$("#chipCad").onclick = e => { const on = !e.target.classList.contains("on"); e.target.classList.toggle("on", on); cadLayer.setMap(on ? map : null); };
$("#chipZone").onclick = e => { zoneOn = !zoneOn; e.target.classList.toggle("on", zoneOn); if (!zoneOn && zoneOverlay){ zoneOverlay.setMap(null); zoneOverlay = null; } updateZone(); };
$("#chipSat").onclick = e => { const on = !e.target.classList.contains("on"); e.target.classList.toggle("on", on); map.setMapTypeId(on ? naver.maps.MapTypeId.HYBRID : naver.maps.MapTypeId.NORMAL); };
$("#chipFit").onclick = fitAll;

async function doSearch(){
  const q = $("#q").value.trim(); if (!q) return;
  $("#q").blur(); toast("검색 중…", 8000);
  const items = await vwSearch(q);
  $("#toast").style.display = "none";
  const box = $("#results");
  if (!items.length){ box.style.display = "none"; toast("검색 결과가 없어요"); return; }
  box.innerHTML = items.map((it,i) => `<div data-i="${i}">${esc(it.title)}${it.sub ? `<br><small>${esc(it.sub)}</small>` : ""}</div>`).join("");
  box.style.display = "block";
  box.onclick = e => {
    const d = e.target.closest("[data-i]"); if (!d) return;
    const it = items[+d.dataset.i];
    map.setCenter(new naver.maps.LatLng(it.y, it.x)); map.setZoom(18);
    box.style.display = "none";
  };
}
$("#qBtn").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

/* ===== 글씨 설정 ===== */
const GF = f => `https://fonts.googleapis.com/css2?family=${f}&display=swap`;
const FONTS = [
  { id:"sys",    name:"기본 (아이폰 글씨)", fam:'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif' },
  { id:"pre",    name:"프리텐다드",        fam:'"Pretendard",sans-serif', css:"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" },
  { id:"noto",   name:"본고딕 (Noto Sans)", fam:'"Noto Sans KR",sans-serif', css:GF("Noto+Sans+KR:wght@400;600;700") },
  { id:"nanum",  name:"나눔고딕",          fam:'"Nanum Gothic",sans-serif', css:GF("Nanum+Gothic:wght@400;700;800") },
  { id:"square", name:"IBM 플렉스 산스",    fam:'"IBM Plex Sans KR",sans-serif', css:GF("IBM+Plex+Sans+KR:wght@400;600;700") },
  { id:"gowun",  name:"고운돋움",          fam:'"Gowun Dodum",sans-serif', css:GF("Gowun+Dodum") },
  { id:"myeong", name:"나눔명조",          fam:'"Nanum Myeongjo",serif', css:GF("Nanum+Myeongjo:wght@400;700;800") }
];
let ui = { font:"sys", size:15 };
try { ui = { ...ui, ...JSON.parse(localStorage.getItem("eduMap.ui") || "{}") }; } catch(e){}
function applyUI(){
  const f = FONTS.find(x => x.id === ui.font) || FONTS[0];
  if (f.css && !document.querySelector(`link[data-font="${f.id}"]`)){
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = f.css; l.dataset.font = f.id; document.head.appendChild(l);
  }
  document.documentElement.style.setProperty("--font", f.fam);
  $("#panel").style.zoom = ui.size / 15;
  try { localStorage.setItem("eduMap.ui", JSON.stringify(ui)); } catch(e){}
}
$("#fontSel").innerHTML = FONTS.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
$("#fontSel").value = ui.font; $("#sizeSel").value = String(ui.size);
$("#fontSel").onchange = e => { ui.font = e.target.value; applyUI(); };
$("#sizeSel").onchange = e => { ui.size = Number(e.target.value); applyUI(); };
$("#setBtn").onclick = () => { const c = $("#setCard"); c.style.display = c.style.display === "none" ? "block" : "none"; };
applyUI();

renderPanel();
loadNaver();
</script>
</body>
</html>
